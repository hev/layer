# hev layer — community edition
#
#   docker compose up
name: hevlayer-ce

services:
  postgres:
    # Unmodified ParadeDB Community server (pg_search 0.18.0 + vector 0.8.0).
    # Source/notices: https://github.com/paradedb/paradedb/tree/v0.18.0
    image: paradedb/paradedb:0.18.0@sha256:fe7c2638af33e6c3b3821bc8c7fab18629e5f43eb6ea3ad86a2966aca855dbb2
    restart: unless-stopped
    environment:
      POSTGRES_USER: layer
      POSTGRES_PASSWORD: local-layer
      POSTGRES_DB: layer
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U layer -d layer"]
      interval: 2s
      timeout: 3s
      retries: 30
  embed:
    # Bundled CPU embedding sidecar (RFC 0120). The image bakes both stock
    # models (all-MiniLM-L6-v2 and bge-small-en-v1.5, 384 dimensions), so it
    # needs no account, key, GPU or download after the image pull. It is
    # reachable only from the gateway over the internal `embed` network: no
    # host port, and no route out of the machine.
    image: ${EMBED_IMAGE:-hevlayer/layer-embed:edge}
    restart: unless-stopped
    networks: [embed]
    healthcheck:
      # Ready means both models verified, loaded and warmed; live-but-loading
      # answers 503. bash /dev/tcp because the image has no curl.
      test:
        - CMD
        - bash
        - -ec
        - exec 3<>/dev/tcp/127.0.0.1/8081; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s
  gateway:
    image: ${GATEWAY_IMAGE:-hevlayer/layer-gateway:0.6.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    networks: [default, embed]
    environment:
      PORT: "8080"
      LAYER_LICENSE: ${HEVLAYER_LICENSE:-}
      TURBOPUFFER_API_KEY: ${TURBOPUFFER_API_KEY:-}
      PGVECTOR_URL: postgresql://layer:local-layer@postgres:5432/layer
      LAYER_TELEMETRY: "off"
      AWS_EC2_METADATA_DISABLED: "true"
      TPUF_URL: ${TPUF_URL:-https://api.turbopuffer.com}
      LAYER_EMBED_URL: http://embed:8081
    depends_on:
      postgres:
        condition: service_healthy
      embed:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /health HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3
      interval: 10s
      timeout: 3s
      retries: 5

  clients:
    profiles: [acceptance]
    build:
      # The public checkout is its own context; layer-pro sets this to its root.
      context: ${ACCEPTANCE_CONTEXT:-.}
      dockerfile: infra/compose/pgvector/Dockerfile.clients
    environment:
      PGVECTOR_GATEWAY_URL: http://gateway:8080
      PGVECTOR_TEST_PREFIX: ${PGVECTOR_TEST_PREFIX:-scratch-lyr-35}
    depends_on:
      gateway:
        condition: service_healthy

networks:
  default: {}
  # Internal: containers on it have no external route. Only the gateway and
  # the embedding sidecar join it, so the sidecar's plaintext HTTP never leaves
  # the Compose project and the sidecar cannot reach the internet.
  embed:
    internal: true

volumes:
  postgres:
