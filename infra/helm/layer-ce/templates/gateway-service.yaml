apiVersion: v1
kind: Service
metadata:
  name: {{ include "layer-ce.fullname" . }}-gateway
  labels:
    {{- include "layer-ce.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    {{- include "layer-ce.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
