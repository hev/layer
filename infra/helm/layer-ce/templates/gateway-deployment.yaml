apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "layer-ce.fullname" . }}-gateway
  labels:
    {{- include "layer-ce.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "layer-ce.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "layer-ce.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ .Values.gateway.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            - name: LAYER_SECRET_LOCAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "layer-ce.gatewaySecretName" . }}
                  key: {{ .Values.vectorStore.credential.secretKey }}
            - name: LAYER_STORE_JSON
              value: {{ dict .Values.vectorStore.name (dict "kind" .Values.vectorStore.kind "default" .Values.vectorStore.default "endpoint" .Values.vectorStore.endpoint "inboundAuth" .Values.vectorStore.inboundAuth) | toJson | quote }}
            {{- if or .Values.license.token .Values.license.existingSecret }}
            - name: LAYER_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ include "layer-ce.licenseSecretName" . }}
                  key: {{ .Values.license.secretKey }}
            {{- end }}
            {{- if .Values.dashboard.enabled }}
            - name: METRICS_BACKEND_URL
              value: {{ default (printf "http://%s-prometheus-server" .Release.Name) .Values.metrics.backendUrl | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
