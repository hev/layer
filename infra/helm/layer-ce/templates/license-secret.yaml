{{- if and .Values.license.token .Values.license.existingSecret -}}
{{- fail "set only one of license.token and license.existingSecret" -}}
{{- end -}}
{{- if .Values.license.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "layer-ce.licenseSecretName" . }}
  labels:
    {{- include "layer-ce.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.license.secretKey }}: {{ .Values.license.token | quote }}
{{- end }}
