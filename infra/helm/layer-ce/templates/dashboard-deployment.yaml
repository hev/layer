{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "layer-ce.fullname" . }}-dashboard
  labels:
    {{- include "layer-ce.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "layer-ce.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "layer-ce.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      containers:
        - name: dashboard
          image: {{ .Values.dashboard.image }}
          imagePullPolicy: {{ .Values.dashboard.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.port }}
          env:
            - name: PORT
              value: {{ .Values.dashboard.port | quote }}
            - name: LAYER_GATEWAY_URL
              value: http://{{ include "layer-ce.fullname" . }}-gateway:{{ .Values.gateway.service.port }}
            - name: LAYER_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "layer-ce.gatewaySecretName" . }}
                  key: {{ .Values.vectorStore.credential.secretKey }}
            - name: LAYER_METRICS_URL
              value: http://{{ include "layer-ce.fullname" . }}-gateway:{{ .Values.gateway.service.port }}/v2/metrics
            - name: LAYER_KUBE_ENABLED
              value: "false"
            - name: DASHBOARD_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "layer-ce.dashboardSecretName" . }}
                  key: {{ .Values.dashboard.basicAuth.userKey }}
            - name: DASHBOARD_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "layer-ce.dashboardSecretName" . }}
                  key: {{ .Values.dashboard.basicAuth.passwordKey }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
{{- end }}
