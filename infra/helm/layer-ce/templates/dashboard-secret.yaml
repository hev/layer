{{- if .Values.dashboard.enabled -}}
{{- $user := .Values.dashboard.basicAuth.user | default "" | trim -}}
{{- $password := .Values.dashboard.basicAuth.password | default "" | trim -}}
{{- $existingSecret := .Values.dashboard.basicAuth.existingSecret | default "" | trim -}}
{{- if and (not $existingSecret) (or (not $user) (not $password)) -}}
{{- fail "dashboard.basicAuth.user and dashboard.basicAuth.password are required when dashboard.enabled=true" -}}
{{- end -}}
{{- if not $existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "layer-ce.dashboardSecretName" . }}
  labels:
    {{- include "layer-ce.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.dashboard.basicAuth.userKey }}: {{ $user | quote }}
  {{ .Values.dashboard.basicAuth.passwordKey }}: {{ $password | quote }}
{{- end }}
{{- end }}
