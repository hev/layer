{{- $apiKey := .Values.vectorStore.credential.apiKey | default "" | trim -}}
{{- $existingSecret := .Values.vectorStore.credential.existingSecret | default "" | trim -}}
{{- if and (not $apiKey) (not $existingSecret) -}}
{{- fail "vectorStore.credential.apiKey or vectorStore.credential.existingSecret is required" -}}
{{- end -}}
{{- if and $apiKey $existingSecret -}}
{{- fail "set only one of vectorStore.credential.apiKey and vectorStore.credential.existingSecret" -}}
{{- end -}}
{{- if $apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "layer-ce.gatewaySecretName" . }}
  labels:
    {{- include "layer-ce.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.vectorStore.credential.secretKey }}: {{ $apiKey | quote }}
{{- end }}
