{
  "gateway": {
    "mcp": {
      "enabled": true,
      "allowedHosts": "mcp.hevlayer.com,aws-us-east-1.hevlayer.com",
      "servers": {
        "bcc": {
          "namespaces": [
            {
              "name": "pov-bcc-pages",
              "toolName": "documents",
              "description": "BCC documents",
              "collapse": {
                "by": "document"
              },
              "filters": [
                "job",
                "doc_type",
                "company",
                "folder_1",
                "folder_2",
                "job_stage",
                "region"
              ],
              "link": "webUrl"
            },
            {
              "name": "pov-bcc-story-pages",
              "toolName": "story_documents",
              "description": "Story Renovations documents, full pages (PDF)",
              "collapse": {
                "by": "document"
              },
              "filters": [
                "company",
                "job",
                "division",
                "region",
                "doc_type"
              ],
              "link": "webUrl",
              "pageLink": true
            },
            {
              "name": "pov-bcc-photos",
              "toolName": "images",
              "description": "BCC images",
              "filters": [
                "job",
                "company",
                "folder_1",
                "folder_2",
                "job_stage",
                "region"
              ],
              "link": "webUrl"
            },
            {
              "name": "ki-invoices",
              "toolName": "ki_invoices",
              "description": "KI AP invoices: one row per invoice with job, vendor, amount, status and whether a document is attached. Booked cost codes are not on this namespace. Pass a row's invoice_id as invoice_ids to the KI MCP tool export_invoice_documents to fetch its document.",
              "filters": [
                "job_number",
                "vendor",
                "status",
                "has_document",
                "job_id"
              ]
            }
          ],
          "host": "mcp.hevlayer.com"
        }
      }
    }
  },
  "mcpIngress": {
    "enabled": true,
    "host": "mcp.hevlayer.com",
    "certificateArn": "arn:aws:acm:us-east-1:186219257916:certificate/3515d949-6eee-443c-b2f1-ae952476a124"
  }
}
