{
  "gateway": {
    "mcp": {
      "enabled": true,
      "allowedHosts": "mcp.hevlayer.com,aws-us-east-1.hevlayer.com",
      "servers": {
        "bcc": {
          "namespaces": [
            {
              "name": "pov-bcc-pages",
              "toolName": "documents",
              "description": "BCC documents. Each hit carries the KI ids of its job: ki_lead_id (pass to the KI MCP project tools), ki_project_id (contract ids), ki_job_number and ki_job_number_prefixed (YY-NNN and DDYY-NNN).",
              "collapse": {
                "by": "document"
              },
              "filters": [
                "job",
                "doc_type",
                "company",
                "folder_1",
                "folder_2",
                "job_stage",
                "region",
                "ki_lead_id",
                "ki_job_number",
                "ki_client_id"
              ],
              "link": "webUrl"
            },
            {
              "name": "pov-bcc-story-pages",
              "toolName": "story_documents",
              "description": "Story Renovations documents, full pages (PDF). Each hit carries the KI ids of its job: ki_lead_id (pass to the KI MCP project tools), ki_project_id (contract ids), ki_job_number and ki_job_number_prefixed (YY-NNN and DDYY-NNN).",
              "collapse": {
                "by": "document"
              },
              "filters": [
                "company",
                "job",
                "division",
                "region",
                "doc_type",
                "ki_lead_id",
                "ki_job_number",
                "ki_client_id"
              ],
              "link": "webUrl",
              "pageLink": true
            },
            {
              "name": "pov-bcc-photos",
              "toolName": "images",
              "description": "BCC images. Each hit carries the KI ids of its job: ki_lead_id (pass to the KI MCP project tools), ki_project_id (contract ids), ki_job_number and ki_job_number_prefixed (YY-NNN and DDYY-NNN).",
              "filters": [
                "job",
                "company",
                "folder_1",
                "folder_2",
                "job_stage",
                "region",
                "ki_lead_id",
                "ki_job_number",
                "ki_client_id"
              ],
              "link": "webUrl"
            },
            {
              "name": "ki-invoice-pages",
              "toolName": "ki_invoice_pages",
              "description": "KI AP invoice PDFs, full pages of text. Each hit carries the invoice's invoice_id, job, vendor and status. Pass invoice_id as invoice_ids to the KI MCP tool export_invoice_documents to fetch the PDF; ki_invoices has the amount and status.",
              "collapse": {
                "by": "document"
              },
              "filters": [
                "job_number",
                "vendor",
                "status",
                "job_id",
                "invoice_number"
              ]
            },
            {
              "name": "ki-projects",
              "toolName": "ki_projects",
              "description": "KI Leads, one row per job: ki_lead_id is the id the KI MCP project tools take, with ki_job_number as KI spells it, name, status, client (ki_client_id) and division.",
              "filters": [
                "ki_lead_id",
                "ki_job_number",
                "ki_job_name",
                "ki_client_id",
                "ki_division_id",
                "ki_status"
              ]
            },
            {
              "name": "ki-contracts",
              "toolName": "ki_contracts",
              "description": "KI contracts (KI's Project table), one row per contract: ki_project_id is the contract id, ki_lead_id the job it belongs to.",
              "filters": [
                "ki_project_id",
                "ki_lead_id",
                "ki_job_number"
              ]
            },
            {
              "name": "ki-companies",
              "toolName": "ki_companies",
              "description": "KI companies, the vendor directory: ki_vendor_id is the id invoices carry as their payee.",
              "filters": [
                "ki_vendor_id",
                "ki_vendor_name",
                "ki_vendor_number"
              ]
            },
            {
              "name": "ki-codes",
              "toolName": "ki_cost_codes",
              "description": "KI cost-code catalog: ki_cost_code_id is the code id, ki_cost_code its display (for example 06-110).",
              "filters": [
                "ki_cost_code_id",
                "ki_cost_code",
                "ki_category"
              ]
            },
            {
              "name": "ki-invoice-vendors",
              "toolName": "ki_invoice_vendors",
              "description": "Which vendor (ki_vendor_id) each KI invoice (ki_invoice_id) was paid to, with its contract (ki_project_id).",
              "filters": [
                "ki_invoice_id",
                "ki_vendor_id",
                "ki_project_id",
                "ki_job_number"
              ]
            },
            {
              "name": "ki-cost-transactions",
              "toolName": "ki_cost_transactions",
              "description": "KI booked costs: one row per ProjectActualCost line, the code KI booked a cost to. ki_cost_code is the code (e.g. 06-110), ki_project_id the contract id, ki_invoice_id the invoice it was booked for (0 when the line is not an AP invoice, such as labor), cost_amount the booked amount, vendor the payee. Totals by vendor for a code: filter ki_cost_code (and ki_project_id), aggregate sum of cost_amount grouped by vendor. Contract ids and job numbers are in ki_contracts.",
              "filters": [
                "ki_cost_code",
                "ki_cost_code_id",
                "ki_project_id",
                "ki_lead_id",
                "ki_invoice_id",
                "vendor",
                "ki_cost_type",
                "cost_amount"
              ]
            },
            {
              "name": "ki-pay-apps",
              "toolName": "ki_pay_apps",
              "description": "KI pay applications: one row per pay app on a contract, with gross billed, retention, amount received and the dates. ki_project_id is the contract id and ki_lead_id the job (see ki_contracts and ki_projects).",
              "filters": [
                "ki_project_id",
                "ki_lead_id",
                "ki_pay_id",
                "accounting_status",
                "gross_billed",
                "amount_received"
              ]
            },
            {
              "name": "ki-invoices",
              "toolName": "ki_invoices",
              "description": "KI AP invoices: one row per invoice with job, vendor, amount, status, whether a document is attached and the cost code KI booked it to. ki_cost_code (e.g. 06-110) is the code carrying most of the booked amount; ki_cost_codes lists every code when the invoice is split (ki_cost_code_status split) and ki_cost_code_status unbooked means KI has booked it to no code. Totals by vendor for a job and cost code: filter job_number and ki_cost_code, aggregate sum of amount grouped by vendor. Pass a row's invoice_id as invoice_ids to the KI MCP tool export_invoice_documents to fetch its document. The invoice PDF text is searchable in ki_invoice_pages. ki_invoice_id is the id the KI MCP takes as invoice_ids; ki_project_id is the contract id; vendor ids are on ki_invoice_vendors; the booked lines are in ki_cost_transactions.",
              "filters": [
                "amount",
                "has_document",
                "job_id",
                "job_number",
                "ki_cost_code",
                "ki_cost_code_status",
                "ki_invoice_id",
                "ki_job_number",
                "ki_project_id",
                "status",
                "vendor"
              ]
            }
          ],
          "host": "mcp.hevlayer.com"
        }
      }
    }
  },
  "mcpIngress": {
    "enabled": true,
    "host": "mcp.hevlayer.com",
    "certificateArn": "arn:aws:acm:us-east-1:186219257916:certificate/3515d949-6eee-443c-b2f1-ae952476a124"
  }
}
