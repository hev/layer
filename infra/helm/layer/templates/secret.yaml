{{- $storeApiKey := .Values.vectorStore.credential.apiKey | trim -}}
{{- $storeSecretKey := .Values.vectorStore.credential.secretKey | default "turbopuffer-api-key" | trim -}}
{{- $storeKind := .Values.vectorStore.kind | default "" | trim -}}
{{- $inboundMode := .Values.vectorStore.inboundAuth.mode | default "" | trim -}}
{{- $gatewaySecretName := include "layer.gatewayApiSecretName" . | trim -}}
{{- $gatewaySecretKey := include "layer.gatewayApiSecretKey" . | trim -}}
{{- $releaseSecretName := include "layer.fullname" . | trim -}}
{{- $dashboardUser := .Values.dashboard.basicAuth.user | default "" | trim -}}
{{- $dashboardPassword := .Values.dashboard.basicAuth.password | default "" | trim -}}
{{- if and (ne $storeKind "search") (not $storeApiKey) }}
{{- fail "vectorStore.credential.apiKey is required — it is the upstream store credential and, under deriveFromStore, the gateway bearer token." }}
{{- end }}
{{- if and (or $storeApiKey (ne $storeKind "search")) (not $storeSecretKey) }}
{{- fail "vectorStore.credential.secretKey is required." }}
{{- end }}
{{- if eq $storeKind "search" }}
{{- if eq $inboundMode "deriveFromStore" }}
{{- fail "vectorStore.inboundAuth.mode must be keys or open when vectorStore.kind=search." }}
{{- end }}
{{- end }}
{{- if not (or (eq $inboundMode "deriveFromStore") (eq $inboundMode "keys") (eq $inboundMode "open")) }}
{{- fail "vectorStore.inboundAuth.mode must be one of deriveFromStore, keys, or open." }}
{{- end }}
{{- if eq $inboundMode "keys" }}
{{- if not .Values.vectorStore.inboundAuth.keys }}
{{- fail "vectorStore.inboundAuth.keys must contain at least one key when mode=keys." }}
{{- end }}
{{- if or (not $gatewaySecretName) (not $gatewaySecretKey) }}
{{- fail "vectorStore.inboundAuth.workerSecretName and workerSecretKey must resolve to non-empty values when mode=keys." }}
{{- end }}
{{- end }}
{{- if .Values.dashboard.enabled }}
{{- if or (not $dashboardUser) (not $dashboardPassword) }}
{{- fail "dashboard.basicAuth.user and dashboard.basicAuth.password are required when dashboard.enabled=true — the dashboard refuses to start without HTTP Basic auth." }}
{{- end }}
{{- end }}
{{- $workerListed := false -}}
{{- $workerRendered := false -}}
{{- if eq $inboundMode "keys" -}}
{{- range .Values.vectorStore.inboundAuth.keys }}
{{- $name := .name | default "" | trim -}}
{{- $secretName := default $releaseSecretName (dig "secretRef" "name" "" .) | trim -}}
{{- $secretKey := default (printf "layer-inbound-%s-api-key" $name) (dig "secretRef" "key" "" .) | trim -}}
{{- $apiKey := .apiKey | default "" | trim -}}
{{- if and $apiKey (ne $secretName $releaseSecretName) -}}
{{- fail (printf "vectorStore.inboundAuth.keys[%s].apiKey can only be used when secretRef.name is omitted or equals the release Secret %s." $name $releaseSecretName) -}}
{{- end -}}
{{- if and (eq $secretName $gatewaySecretName) (eq $secretKey $gatewaySecretKey) -}}
{{- $workerListed = true -}}
{{- if $apiKey -}}
{{- $workerRendered = true -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not $workerListed -}}
{{- fail (printf "mode=keys requires a vectorStore.inboundAuth.keys entry whose secretRef matches workerSecretName/workerSecretKey (%s/%s)." $gatewaySecretName $gatewaySecretKey) -}}
{{- end -}}
{{- if and (eq $gatewaySecretName $releaseSecretName) (not $workerRendered) -}}
{{- fail (printf "mode=keys requires a vectorStore.inboundAuth.keys entry with apiKey rendered at secretRef.key %s for operator/dashboard/KEDA." $gatewaySecretKey) -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "layer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "layer.labels" . | nindent 4 }}
type: Opaque
{{- $hasStringData := or $storeApiKey $workerRendered (and $dashboardUser $dashboardPassword) -}}
{{- if not $hasStringData }}
stringData: {}
{{- else }}
stringData:
  {{- if $storeApiKey }}
  {{ $storeSecretKey | quote }}: {{ $storeApiKey | quote }}
  {{- end }}
  {{- if eq $inboundMode "keys" }}
  {{- range .Values.vectorStore.inboundAuth.keys }}
  {{- $name := .name | default "" | trim -}}
  {{- $secretName := default $releaseSecretName (dig "secretRef" "name" "" .) | trim -}}
  {{- $secretKey := default (printf "layer-inbound-%s-api-key" $name) (dig "secretRef" "key" "" .) | trim -}}
  {{- $apiKey := .apiKey | default "" | trim -}}
  {{- if and $apiKey (eq $secretName $releaseSecretName) }}
  {{ $secretKey | quote }}: {{ $apiKey | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and $dashboardUser $dashboardPassword }}
  dashboard-basic-auth-user: {{ $dashboardUser | quote }}
  dashboard-basic-auth-password: {{ $dashboardPassword | quote }}
  {{- end }}
{{- end }}
