{{- if and (dig "functionReadCache" "configMapName" "" .Values.gateway) (dig "fieldStatsCapture" "configMapName" "" .Values.gateway) }}
{{- fail "configure one shared writer authority: functionReadCache or fieldStatsCapture" }}
{{- end }}
{{- if gt (int .Values.gateway.replicas) 1 }}
{{- fail "gateway.replicas must be 1: the embedded queue is pod-local, and an external queue Postgres only decouples storage from gateway rolls; steady-state replicas>1 waits for the singleton-loop audit (docs/learnings/functions/gateway-roll-survival.md)" }}
{{- end }}
{{- if and .Values.gateway.queue.embedded (not (or (eq .Values.gateway.queue.persistence.type "hostPath") (eq .Values.gateway.queue.persistence.type "pvc"))) }}
{{- fail "gateway.queue.persistence.type must be hostPath or pvc" }}
{{- end }}
{{- if and (not .Values.gateway.queue.embedded) (not .Values.gateway.queue.external.databaseUrlSecret.name) }}
{{- fail "gateway.queue.embedded=false requires gateway.queue.external.databaseUrlSecret.name" }}
{{- end }}
{{- if not .Values.documentCache.enabled }}
{{- fail "documentCache.enabled=true is required; legacy aerospike modes were removed" }}
{{- end }}
{{- if and .Values.gateway.embed.enabled (not .Values.gateway.embed.image) }}
{{- fail "gateway.embed.image is required when gateway.embed.enabled=true (customer pull path: hevlayer/layer-embed:<version>)" }}
{{- end }}
{{- if and .Values.gateway.localModels.enabled (not .Values.gateway.embed.enabled) }}
{{- fail "gateway.localModels.enabled requires gateway.embed.enabled=true; the bundle mounts into the embedding sidecar, not the gateway" }}
{{- end }}
{{- $embedPort := int .Values.gateway.embed.port -}}
{{- $metricsEmbedded := and .Values.metrics.enabled .Values.metrics.embedded (not .Values.metrics.externalEndpoint) -}}
{{- $indexNamespace := default .Release.Namespace (default .Values.operator.discovery.indexNamespace .Values.gateway.indexNamespace) -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "layer.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  serviceName: {{ include "layer.fullname" . }}-gateway
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      {{- include "layer.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "layer.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
        layer.hev.dev/component: gateway
    spec:
      serviceAccountName: {{ include "layer.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.gateway.drain.terminationGracePeriodSeconds }}
      {{- include "layer.priorityClassName" (dict "root" $ "tier" "gateway") | nindent 6 }}
      nodeSelector:
        {{- include "layer.nodeSelector" (dict "role" "system") | nindent 8 }}
      tolerations:
        {{- include "layer.roleToleration" (dict "role" "system") | nindent 8 }}
      {{- if or .Values.gateway.lattice.enabled .Values.gateway.localClip.enabled .Values.gateway.localModels.enabled }}
      initContainers:
        {{- if .Values.gateway.lattice.enabled }}
        - name: lattice-model
          image: {{ required "gateway.lattice.artifact.image is required when gateway.lattice.enabled=true" .Values.gateway.lattice.artifact.image | quote }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              artifact_dir=/var/lib/hevlayer/lattice
              aws s3 cp "{{ required "gateway.lattice.artifact.s3Uri is required when gateway.lattice.enabled=true" .Values.gateway.lattice.artifact.s3Uri }}/model.safetensors" "$artifact_dir/model.safetensors" --only-show-errors
              aws s3 cp "{{ .Values.gateway.lattice.artifact.s3Uri }}/tokenizer.json" "$artifact_dir/tokenizer.json" --only-show-errors
              echo "{{ required "gateway.lattice.artifact.modelSha256 is required when gateway.lattice.enabled=true" .Values.gateway.lattice.artifact.modelSha256 }}  $artifact_dir/model.safetensors" | sha256sum -c -
              echo "{{ required "gateway.lattice.artifact.tokenizerSha256 is required when gateway.lattice.enabled=true" .Values.gateway.lattice.artifact.tokenizerSha256 }}  $artifact_dir/tokenizer.json" | sha256sum -c -
          volumeMounts:
            - name: lattice-model
              mountPath: /var/lib/hevlayer/lattice
        {{- end }}
        {{- if .Values.gateway.localClip.enabled }}
        - name: local-clip-model
          image: {{ required "gateway.localClip.artifact.image is required when gateway.localClip.enabled=true" .Values.gateway.localClip.artifact.image | quote }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              artifact_dir=/var/lib/hevlayer/clip
              artifact_uri={{ required "gateway.localClip.artifact.s3Uri is required when gateway.localClip.enabled=true" .Values.gateway.localClip.artifact.s3Uri | quote }}
              for file in model.safetensors tokenizer.json config.json preprocessor_config.json; do
                aws s3 cp "$artifact_uri/$file" "$artifact_dir/$file" --only-show-errors
              done
              echo "{{ required "gateway.localClip.artifact.modelSha256 is required when gateway.localClip.enabled=true" .Values.gateway.localClip.artifact.modelSha256 }}  $artifact_dir/model.safetensors" | sha256sum -c -
              echo "{{ required "gateway.localClip.artifact.tokenizerSha256 is required when gateway.localClip.enabled=true" .Values.gateway.localClip.artifact.tokenizerSha256 }}  $artifact_dir/tokenizer.json" | sha256sum -c -
              echo "{{ required "gateway.localClip.artifact.configSha256 is required when gateway.localClip.enabled=true" .Values.gateway.localClip.artifact.configSha256 }}  $artifact_dir/config.json" | sha256sum -c -
              echo "{{ required "gateway.localClip.artifact.preprocessorSha256 is required when gateway.localClip.enabled=true" .Values.gateway.localClip.artifact.preprocessorSha256 }}  $artifact_dir/preprocessor_config.json" | sha256sum -c -
          volumeMounts:
            - name: local-clip-model
              mountPath: /var/lib/hevlayer/clip
        {{- end }}
        {{- if .Values.gateway.localModels.enabled }}
        # RFC 0120 offline bundle: fetch manifest.json and the files it lists,
        # pin the manifest, and let the sidecar verify each file against it.
        - name: local-models
          image: {{ required "gateway.localModels.artifact.image is required when gateway.localModels.enabled=true" .Values.gateway.localModels.artifact.image | quote }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              bundle_dir=/models
              bundle_uri={{ required "gateway.localModels.artifact.s3Uri is required when gateway.localModels.enabled=true" .Values.gateway.localModels.artifact.s3Uri | quote }}
              aws s3 cp "$bundle_uri/manifest.json" "$bundle_dir/manifest.json" --only-show-errors
              echo "{{ required "gateway.localModels.artifact.manifestSha256 is required when gateway.localModels.enabled=true" .Values.gateway.localModels.artifact.manifestSha256 }}  $bundle_dir/manifest.json" | sha256sum -c -
              aws s3 sync "$bundle_uri/" "$bundle_dir/" --only-show-errors --exclude 'manifest.json'
              chmod -R a-w "$bundle_dir"
          volumeMounts:
            - name: local-models
              mountPath: /models
        {{- end }}
      {{- end }}
      containers:
        {{- if .Values.gateway.embed.enabled }}
        # CPU embedding sidecar (RFC 0120): loopback only, so its plaintext
        # private protocol never leaves the pod. Ready means both stock models
        # (plus any mounted bundle) verified, loaded and warmed.
        - name: embed
          image: {{ .Values.gateway.embed.image | quote }}
          imagePullPolicy: {{ default "IfNotPresent" .Values.gateway.embed.imagePullPolicy | quote }}
          env:
            - name: LAYER_EMBED_BIND
              value: "127.0.0.1:{{ $embedPort }}"
            {{- if .Values.gateway.localModels.enabled }}
            - name: LAYER_EMBED_MODELS_DIR
              value: {{ .Values.gateway.localModels.mountPath | quote }}
            {{- end }}
          {{- with .Values.gateway.embed.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.gateway.localModels.enabled }}
          volumeMounts:
            - name: local-models
              mountPath: {{ .Values.gateway.localModels.mountPath | quote }}
              readOnly: true
          {{- end }}
          # The image ships no curl; bash /dev/tcp reaches the loopback bind,
          # which an httpGet probe from the kubelet cannot.
          startupProbe:
            exec:
              command:
                - bash
                - -ec
                - exec 3<>/dev/tcp/127.0.0.1/{{ $embedPort }}; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - exec 3<>/dev/tcp/127.0.0.1/{{ $embedPort }}; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - exec 3<>/dev/tcp/127.0.0.1/{{ $embedPort }}; printf 'GET /health/live HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3
            periodSeconds: 10
            failureThreshold: 3
        {{- end }}
        {{- if .Values.gateway.queue.embedded }}
        - name: postgres
          image: {{ .Values.gateway.queue.postgres.image | quote }}
          args:
            - "-c"
            - "config_file=/etc/layer-postgres/postgresql.conf"
            - "-c"
            - "hba_file=/etc/layer-postgres/pg_hba.conf"
          env:
            - name: POSTGRES_USER
              value: {{ .Values.gateway.queue.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.gateway.queue.postgres.database | quote }}
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: gateway-internal-config
              mountPath: /etc/layer-postgres/postgresql.conf
              subPath: postgresql.conf
            - name: gateway-internal-config
              mountPath: /etc/layer-postgres/pg_hba.conf
              subPath: pg_hba.conf
            - name: pg-data
              mountPath: /var/lib/postgresql/data
              {{- if eq .Values.gateway.queue.persistence.type "hostPath" }}
              subPathExpr: $(POD_NAME)
              {{- end }}
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -h
                - "127.0.0.1"
                - -U
                - {{ .Values.gateway.queue.postgres.user | quote }}
                - -d
                - {{ .Values.gateway.queue.postgres.database | quote }}
            initialDelaySeconds: 5
            periodSeconds: 10
        {{- end }}
        {{- if $metricsEmbedded }}
        - name: vmsingle
          image: victoriametrics/victoria-metrics:v1.106.1
          args:
            - "-storageDataPath=/vm-data"
            - "-retentionPeriod={{ .Values.metrics.retentionPeriod }}"
            - "-httpListenAddr=127.0.0.1:8429"
            - "-promscrape.config=/etc/vmsingle/scrape.yaml"
            - "-promscrape.configCheckInterval=30s"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: vm-data
              mountPath: /vm-data
              subPathExpr: $(POD_NAME)
            - name: scrape-config
              mountPath: /etc/vmsingle
        {{- end }}
        - name: gateway
          image: {{ .Values.gateway.image }}
          imagePullPolicy: {{ default "Always" .Values.gateway.imagePullPolicy | quote }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
              name: http
          env:
            - name: LAYER_MCP_ENABLED
              value: {{ .Values.gateway.mcp.enabled | quote }}
            {{- if .Values.gateway.mcp.enabled }}
            - name: LAYER_MCP_ALLOWED_HOSTS
              value: {{ .Values.gateway.mcp.allowedHosts | quote }}
            - name: LAYER_MCP_JSON
              value: {{ .Values.gateway.mcp.servers | toJson | quote }}
            {{- end }}
            - name: PORT
              value: {{ .Values.gateway.port | quote }}
            {{- with (dig "functionReadCache" "configMapName" "" .Values.gateway) }}
            - name: LAYER_FUNCTION_READ_CACHE_CONFIG
              value: /etc/layer/function-read-cache/cache.json
            {{- end }}
            {{- with (dig "fieldStatsCapture" "configMapName" "" .Values.gateway) }}
            - name: LAYER_FIELD_STATS_CAPTURE_CONFIG
              value: /etc/layer/field-stats-capture/capture.json
            {{- end }}
            {{- if not (dig "telemetry" "enabled" true .Values.gateway) }}
            - name: LAYER_TELEMETRY
              value: "off"
            {{- end }}
            - name: LAYER_DRAIN_MARKER_PATH
              value: {{ .Values.gateway.drain.markerPath | quote }}
            - name: AEROSPIKE_HOSTS
              value: "{{ include "layer.fullname" . }}-document-cache:{{ .Values.documentCache.port }}"
            - name: AEROSPIKE_NAMESPACE
              value: {{ .Values.documentCache.namespace | quote }}
            - name: AEROSPIKE_SET_PREFIX
              value: {{ .Values.documentCache.setPrefix | quote }}
            {{- if and .Values.documentCache.enabled .Values.documentCache.clusterName }}
            - name: AEROSPIKE_CLUSTER_NAME
              value: {{ .Values.documentCache.clusterName | quote }}
            {{- end }}
            - name: LAYER_SHARD_COUNT
              value: {{ .Values.gateway.shardCount | quote }}
            - name: LAYER_FEDERATED_QUERY_MAX_NAMESPACES
              value: {{ .Values.gateway.federatedQuery.maxNamespaces | quote }}
            - name: LAYER_FEDERATED_QUERY_NAMESPACE_THREADS
              value: {{ .Values.gateway.federatedQuery.namespaceThreads | quote }}
            - name: CONSISTENCY_STABLE_POLL_INTERVAL_MS
              value: {{ .Values.gateway.consistency.stablePollIntervalMs | quote }}
            - name: PIPELINE_SEGMENT_SIZE
              value: {{ .Values.gateway.queue.segmentSize | quote }}
            - name: LAYER_INDEX_GC_ENABLED
              value: {{ .Values.gateway.indexGc.enabled | quote }}
            - name: LAYER_INDEX_CONFIG_ENABLED
              value: {{ .Values.gateway.indexConfig.enabled | quote }}
            - name: LAYER_INDEX_NAMESPACE
              value: {{ $indexNamespace | quote }}
            - name: LAYER_VECTORSTORE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: LAYER_AWS_COST_EXPLORER_ENABLED
              value: {{ .Values.gateway.cost.costExplorerEnabled | quote }}
            - name: LAYER_AWS_COST_REGION
              value: {{ .Values.gateway.cost.region | quote }}
            - name: LAYER_AWS_COST_TAG_KEY
              value: {{ .Values.gateway.cost.tagKey | quote }}
            - name: LAYER_AWS_COST_TAG_VALUE
              value: {{ .Values.gateway.cost.tagValue | quote }}
            - name: LAYER_AWS_COST_SITE
              value: {{ .Values.gateway.cost.site | quote }}
            - name: LAYER_AWS_COST_CACHE_TTL_SECONDS
              value: {{ .Values.gateway.cost.cacheTtlSeconds | quote }}
            {{- if .Values.gateway.lattice.enabled }}
            - name: LAYER_LATTICE_MODEL_PATH
              value: {{ .Values.gateway.lattice.modelPath | quote }}
            {{- end }}
            {{- if .Values.gateway.localClip.enabled }}
            - name: LAYER_LOCAL_CLIP_MODEL_PATH
              value: {{ .Values.gateway.localClip.modelPath | quote }}
            {{- end }}
            {{- if .Values.gateway.embed.enabled }}
            - name: LAYER_EMBED_URL
              value: "http://127.0.0.1:{{ $embedPort }}"
            {{- end }}
            - name: LAYER_KEY_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ include "layer.fullname" . }}-keys
                  key: pepper
            - name: LAYER_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ default "hevlayer-license" .Values.license.existingSecret | quote }}
                  key: {{ .Values.license.secretKey | default "license" | quote }}
                  optional: true
            {{- if .Values.license.grace.gatewaySeconds }}
            - name: LAYER_GRACE_GATEWAY
              value: {{ .Values.license.grace.gatewaySeconds | quote }}
            {{- end }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            {{- if .Values.s3.endpoint }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            {{- end }}
            {{- if .Values.gateway.queue.embedded }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.gateway.queue.postgres.user }}@127.0.0.1:5432/{{ .Values.gateway.queue.postgres.database }}"
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.queue.external.databaseUrlSecret.name | quote }}
                  key: {{ .Values.gateway.queue.external.databaseUrlSecret.key | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - name: METRICS_BACKEND_URL
              {{- if .Values.metrics.externalEndpoint }}
              value: {{ .Values.metrics.externalEndpoint | quote }}
              {{- else if .Values.metrics.embedded }}
              value: "http://127.0.0.1:8429"
              {{- else }}
              value: "http://{{ include "layer.fullname" . }}-vmsingle:8429"
              {{- end }}
            {{- end }}
          {{- if or .Values.gateway.lattice.enabled .Values.gateway.localClip.enabled (dig "fieldStatsCapture" "configMapName" "" .Values.gateway) (dig "functionReadCache" "configMapName" "" .Values.gateway) }}
          volumeMounts:
            {{- if (dig "functionReadCache" "configMapName" "" .Values.gateway) }}
            - name: function-read-cache
              mountPath: /etc/layer/function-read-cache
              readOnly: true
            {{- end }}
            {{- if (dig "fieldStatsCapture" "configMapName" "" .Values.gateway) }}
            - name: field-stats-capture
              mountPath: /etc/layer/field-stats-capture
              readOnly: true
            {{- end }}
            {{- if .Values.gateway.lattice.enabled }}
            - name: lattice-model
              mountPath: /var/lib/hevlayer/lattice
              readOnly: true
            {{- end }}
            {{- if .Values.gateway.localClip.enabled }}
            - name: local-clip-model
              mountPath: /var/lib/hevlayer/clip
              readOnly: true
            {{- end }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "touch {{ .Values.gateway.drain.markerPath }} && sleep {{ .Values.gateway.drain.preStopSleepSeconds }}"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        {{- if (dig "functionReadCache" "configMapName" "" .Values.gateway) }}
        - name: function-read-cache
          configMap:
            name: {{ .Values.gateway.functionReadCache.configMapName | quote }}
            items:
              - key: cache.json
                path: cache.json
        {{- end }}
        {{- if (dig "fieldStatsCapture" "configMapName" "" .Values.gateway) }}
        - name: field-stats-capture
          configMap:
            name: {{ .Values.gateway.fieldStatsCapture.configMapName | quote }}
            items:
              - key: capture.json
                path: capture.json
        {{- end }}
        {{- if .Values.gateway.lattice.enabled }}
        - name: lattice-model
          emptyDir: {}
        {{- end }}
        {{- if .Values.gateway.localClip.enabled }}
        - name: local-clip-model
          emptyDir:
            sizeLimit: 1Gi
        {{- end }}
        {{- if .Values.gateway.localModels.enabled }}
        - name: local-models
          emptyDir:
            sizeLimit: {{ .Values.gateway.localModels.artifact.sizeLimit | quote }}
        {{- end }}
        {{- if .Values.gateway.queue.embedded }}
        - name: gateway-internal-config
          configMap:
            name: {{ include "layer.fullname" . }}-gateway-internal
        {{- end }}
        {{- if and .Values.gateway.queue.embedded (eq .Values.gateway.queue.persistence.type "hostPath") }}
        - name: pg-data
          hostPath:
            path: {{ .Values.gateway.queue.persistence.hostPath | quote }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.gateway.queue.embedded }}
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.gateway.queue.postgres.shmSize | quote }}
        {{- end }}
        {{- if $metricsEmbedded }}
        - name: vm-data
          hostPath:
            path: {{ .Values.metrics.storage.hostPath | quote }}
            type: DirectoryOrCreate
        - name: scrape-config
          configMap:
            name: {{ include "layer.fullname" . }}-vmsingle-scrape
        {{- end }}
  {{- if and .Values.gateway.queue.embedded (eq .Values.gateway.queue.persistence.type "pvc") }}
  volumeClaimTemplates:
    - metadata:
        name: pg-data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.gateway.queue.persistence.storageClassName }}
        storageClassName: {{ .Values.gateway.queue.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.gateway.queue.persistence.size | quote }}
  {{- end }}
