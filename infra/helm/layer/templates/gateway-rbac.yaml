{{- if or .Values.gateway.computeSpecAccess.enabled .Values.gateway.indexConfig.enabled .Values.gateway.indexGc.enabled }}
{{- $saName := include "layer.serviceAccountName" . }}
{{- $verbs := list "get" "list" "watch" -}}
{{- if .Values.gateway.computeSpecAccess.mutate -}}
{{- $verbs = list "get" "list" "watch" "create" "update" "patch" "delete" -}}
{{- end -}}
{{- $indexVerbs := list -}}
{{- if .Values.gateway.indexConfig.enabled -}}
{{- $indexVerbs = concat $indexVerbs (list "get" "list" "watch") -}}
{{- end -}}
{{- if .Values.gateway.indexGc.enabled -}}
{{- $indexVerbs = append $indexVerbs "delete" -}}
{{- end -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "layer.fullname" . }}-gateway-compute-specs
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  {{- if .Values.gateway.computeSpecAccess.enabled }}
  - apiGroups: ["hevlayer.com"]
    resources: ["agents", "functions", "pipelines"]
    verbs: {{ toJson $verbs }}
  - apiGroups: ["hevlayer.com"]
    resources: ["agents/status", "functions/status", "pipelines/status"]
    verbs: ["get"]
  {{- end }}
  {{- if $indexVerbs }}
  - apiGroups: ["hevlayer.com"]
    resources: ["indexes"]
    verbs: {{ toJson $indexVerbs }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "layer.fullname" . }}-gateway-compute-specs
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "layer.fullname" . }}-gateway-compute-specs
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
