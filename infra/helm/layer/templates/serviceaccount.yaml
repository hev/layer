{{- if .Values.serviceAccount.create }}
{{- $gatewayServiceAccountName := include "layer.serviceAccountName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $gatewayServiceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "layer.labels" . | nindent 4 }}
  {{- with include "layer.serviceAccountAnnotations" (dict "root" $ "roleArn" .Values.serviceAccount.roleArn "clientId" .Values.serviceAccount.clientId) }}
  {{- . | trim | nindent 2 }}
  {{- end }}
{{- end }}
{{- if and .Values.dashboard.enabled .Values.dashboard.serviceAccount.create (ne (include "layer.dashboardServiceAccountName" .) (include "layer.serviceAccountName" .)) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "layer.dashboardServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  {{- with include "layer.serviceAccountAnnotations" (dict "root" $ "roleArn" .Values.dashboard.serviceAccount.roleArn "clientId" .Values.dashboard.serviceAccount.clientId) }}
  {{- . | trim | nindent 2 }}
  {{- end }}
{{- end }}
