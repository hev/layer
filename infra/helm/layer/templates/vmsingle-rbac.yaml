{{- if and .Values.metrics.enabled (not .Values.metrics.externalEndpoint) }}
# vmsingle's promscrape kubernetes_sd_configs need cluster-scope discovery for
# kube-state-metrics endpoint discovery, while the layer-pods job remains
# restricted to the release namespace in the scrape config.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "layer.fullname" . }}-vmsingle
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: vmsingle
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "layer.fullname" . }}-vmsingle
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: vmsingle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "layer.fullname" . }}-vmsingle
subjects:
  - kind: ServiceAccount
    name: {{ include "layer.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
