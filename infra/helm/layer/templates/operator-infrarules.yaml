{{- if and .Values.operator.enabled .Values.operator.infraRules.create }}
apiVersion: hevlayer.com/v1alpha1
kind: InfraRules
metadata:
  name: default
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  computePools:
    {{- range .Values.operator.infraRules.computePools }}
    - name: {{ .name | quote }}
      kind: {{ .kind | quote }}
      {{- with .gpuType }}
      gpuType: {{ . | quote }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .resources }}
      resources:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      maxReplicasPerWorkload: {{ .maxReplicasPerWorkload }}
    {{- end }}
  {{- if .Values.documentCache.enabled }}
  documentCache:
    capGiB: {{ .Values.operator.infraRules.documentCache.capGiB }}
    replicationFactor: {{ .Values.operator.infraRules.documentCache.replicationFactor }}
    scaling:
      mode: {{ .Values.operator.infraRules.documentCache.scaling.mode | quote }}
      nodes:
        min: {{ .Values.documentCache.keda.minReplicaCount }}
        max: {{ .Values.documentCache.keda.maxReplicaCount }}
  {{- end }}
{{- end }}
