{{- if .Values.search.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "layer.fullname" . }}-search
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: search
spec:
  selector:
    {{- include "layer.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: search
  ports:
    - name: http
      port: {{ .Values.search.port }}
      targetPort: http
{{- end }}
