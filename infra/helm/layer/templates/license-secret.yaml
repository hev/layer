{{- if and .Values.license.token .Values.license.existingSecret }}
{{- fail "license.token and license.existingSecret are mutually exclusive." }}
{{- end }}
{{- if .Values.license.token }}
apiVersion: v1
kind: Secret
metadata:
  name: hevlayer-license
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "layer.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.license.secretKey | default "license" | quote }}: {{ .Values.license.token | quote }}
{{- end }}
