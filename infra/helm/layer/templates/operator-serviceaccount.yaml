{{- if and .Values.operator.enabled .Values.operator.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-operator" (include "layer.fullname" .)) .Values.operator.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  {{- with include "layer.serviceAccountAnnotations" (dict "root" $ "roleArn" .Values.operator.serviceAccount.roleArn "clientId" .Values.operator.serviceAccount.clientId) }}
  {{- . | trim | nindent 2 }}
  {{- end }}
{{- end }}
