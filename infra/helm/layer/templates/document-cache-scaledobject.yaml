{{- if and .Values.documentCache.enabled .Values.documentCache.keda.enabled }}
{{- $metricsURL := "" -}}
{{- $pointsAtGateway := false -}}
{{- if .Values.documentCache.keda.serverAddress -}}
{{- $metricsURL = .Values.documentCache.keda.serverAddress -}}
{{- else if .Values.metrics.externalEndpoint -}}
{{- $metricsURL = .Values.metrics.externalEndpoint -}}
{{- else if .Values.metrics.embedded -}}
{{- $metricsURL = printf "http://%s-gateway.%s.svc.cluster.local:%d/v2/metrics" (include "layer.fullname" .) .Release.Namespace (int .Values.gateway.port) -}}
{{- $pointsAtGateway = true -}}
{{- else -}}
{{- $metricsURL = printf "http://%s-vmsingle.%s.svc.cluster.local:8429" (include "layer.fullname" .) .Release.Namespace -}}
{{- end -}}
{{- if $pointsAtGateway }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "layer.fullname" . }}-document-cache-gateway-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-cache
spec:
  secretTargetRef:
    - parameter: bearerToken
      name: {{ include "layer.gatewayApiSecretName" . | quote }}
      key: {{ include "layer.gatewayApiSecretKey" . | quote }}
---
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "layer.fullname" . }}-document-cache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "layer.labels" . | nindent 4 }}
    app.kubernetes.io/component: document-cache
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "layer.fullname" . }}-document-cache
  pollingInterval: {{ .Values.documentCache.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.documentCache.keda.cooldownPeriod }}
  minReplicaCount: {{ .Values.documentCache.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.documentCache.keda.maxReplicaCount }}
  triggers:
    - type: prometheus
      metadata:
        serverAddress: {{ $metricsURL | quote }}
        metricName: layer_document_cache_demand
        query: {{ printf "sum(increase(hevlayer_cache_demand_total[%s])) or vector(0)" .Values.documentCache.keda.demandWindow | quote }}
        threshold: {{ .Values.documentCache.keda.threshold | quote }}
        activationThreshold: {{ .Values.documentCache.keda.activationThreshold | quote }}
        {{- if $pointsAtGateway }}
        authModes: "bearer"
      authenticationRef:
        name: {{ include "layer.fullname" . }}-document-cache-gateway-auth
        {{- end }}
{{- end }}
