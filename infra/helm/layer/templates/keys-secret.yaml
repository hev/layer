{{- /*
LAYER_KEY_PEPPER for minted API keys (RFC 0045). The pepper feeds the
argon2id verifier on every minted token, so it must be identical for the
gateway (REST mint + verify) and the operator (CRD-authored mint), and it
must survive upgrades — losing it invalidates every minted key. When
keys.pepper is unset, a random pepper is generated once and re-read from
the live Secret on subsequent renders.
*/ -}}
{{- $secretName := printf "%s-keys" (include "layer.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $pepper := .Values.keys.pepper | default "" | trim -}}
{{- if not $pepper -}}
{{- if and $existing $existing.data $existing.data.pepper -}}
{{- $pepper = $existing.data.pepper | b64dec -}}
{{- else -}}
{{- $pepper = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "layer.labels" . | nindent 4 }}
type: Opaque
stringData:
  pepper: {{ $pepper | quote }}
