    shortNames: []
    singular: apikey
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .status.lastSeenAt
      name: LastSeen
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ApiKeySpec via `CustomResource`
        properties:
          spec:
            properties:
              description:
                nullable: true
                type: string
              entitlements:
                additionalProperties:
                  properties:
                    claims:
                      description: Opaque claim strings. Layer stores and echoes them, never interprets them.
                      items:
                        type: string
                      type: array
                    namespaces:
                      description: Upstream-namespace globs constraining a vectorstore grant.
                      items:
                        type: string
                      type: array
                    scopes:
                      description: Layer-enforced scopes against the entitlement's target.
                      items:
                        enum:
                        - read
                        - write
                        - admin
                        type: string
                      type: array
                  type: object
                description: 'Map keyed by target resource: `vectorstore.<name>`, `warehouse.<name>`, `agent.<name>`, or `layer`. Unknown prefixes are rejected at admission; a missing target is an `EntitlementTargetMissing` status condition, not an error.'
                type: object
                x-kubernetes-validations:
                - message: entitlement keys must be 'layer', 'vectorstore.<name>', 'warehouse.<name>', or 'agent.<name>'
                  rule: self.all(k, k == 'layer' || (k.startsWith('vectorstore.') && k.size() > 12) || (k.startsWith('warehouse.') && k.size() > 10) || (k.startsWith('agent.') && k.size() > 6))
              expiresAfter:
                default: 365d
                description: Duration (`365d`, `12h`) or `never`. `status.expiresAt` is computed at mint.
                type: string
              owner:
                description: Free-form owner label, echoed in list and authenticate responses.
                nullable: true
                type: string
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    reason:
                      nullable: true
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              createdAt:
                nullable: true
                type: string
              expiresAt:
                nullable: true
                type: string
              keyId:
                description: Stable UUID assigned at mint; the external actor id.
                nullable: true
                type: string
              lastSeenAt:
                description: Advances at most once per five minutes per key.
                nullable: true
                type: string
              lookupHash:
                description: Indexed token fingerprint, `sha256:<hex>`. One-way.
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                default: Pending
                description: Phases keep Kubernetes' PascalCase convention (`Active`, not `active`) — they surface verbatim in REST responses and kubectl printcolumns.
                enum:
                - Pending
                - Active
                - Revoked
                - Expired
                type: string
              revokedAt:
                nullable: true
                type: string
              secretRef:
                description: Token-delivery Secret, set only for CRD-authored keys.
                nullable: true
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              tokenHash:
                description: argon2id+pepper verifier as a PHC string. One-way.
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: ApiKey
        type: object
    served: true
    storage: true
    subresources:
      status: {}

