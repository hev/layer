      name: Pipelines
      type: integer
    - jsonPath: .status.consumers.apiKeys
      name: Keys
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for WarehouseSpec via `CustomResource`
        properties:
          spec:
            properties:
              huggingface:
                nullable: true
                properties:
                  endpoint:
                    default: https://huggingface.co
                    description: Hub endpoint. Defaults to the public Hugging Face Hub; override for Enterprise Hub or a mirror.
                    type: string
                  tokenSecretRef:
                    description: Optional Secret in the same namespace holding `token` for gated or private datasets. Public datasets do not require a Secret.
                    nullable: true
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                type: object
              kind:
                description: Warehouse source kind. `databricks` and `iceberg` remain reserved; `snowflake`, `huggingface`, `rss`, `youtube`, and `rest` are admitted and reconciled.
                enum:
                - snowflake
                - huggingface
                - rss
                - youtube
                - rest
                - databricks
                - iceberg
                type: string
                x-kubernetes-validations:
                - message: spec.kind is reserved but not implemented; v1 supports snowflake, huggingface, rss, youtube, and rest
                  rule: self in ['snowflake', 'huggingface', 'rss', 'youtube', 'rest']
              rest:
                nullable: true
                properties:
                  auth:
                    description: Optional static credential applied to every probe and source request.
                    nullable: true
                    properties:
                      in:
                        enum:
                        - query
                        - header
                        type: string
                      name:
                        type: string
                      secretRef:
                        properties:
                          name:
                            type: string
                        required:
                        - name
                        type: object
                    required:
                    - in
                    - name
                    - secretRef
                    type: object
                  baseUrl:
                    description: JSON API origin, for example `https://api.fda.gov`.
                    type: string
                  rateLimit:
                    description: Politeness cap enforced by source workers.
                    nullable: true
                    properties:
                      requestsPerSecond:
                        format: double
                        type: number
                    required:
                    - requestsPerSecond
                    type: object
                  verify:
                    description: Cheap reachability endpoint probed by the operator.
                    properties:
                      path:
                        type: string
                      query:
                        additionalProperties:
                          type: string
                        type: object
                    required:
                    - path
                    type: object
                required:
                - baseUrl
                - verify
                type: object
              rss:
                nullable: true
                properties:
                  userAgent:
                    default: hevlayer/rss-source (+https://hevlayer.com)
                    description: User-Agent sent by stock RSS source workers when fetching public feeds.
                    type: string
                type: object
              snowflake:
                nullable: true
                properties:
                  account:
                    description: Snowflake account identifier.
                    type: string
                  keyPairSecretRef:
                    description: Secret in the same namespace holding `private-key.pem` and optional `passphrase`. The credential is never stored in the CRD.
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                  pool:
                    nullable: true
                    properties:
                      size:
                        default: 5
                        format: int32
                        type: integer
                      timeout:
                        default: 30s
                        type: string
                    type: object
                  role:
                    description: Optional role assumed on connect.
                    nullable: true
                    type: string
                  user:
                    description: Service user the key pair authenticates.
                    type: string
                  warehouse:
                    description: Snowflake compute warehouse extraction queries run on.
                    type: string
                required:
                - account
                - keyPairSecretRef
                - user
                - warehouse
                type: object
              verifyInterval:
                default: 1h
                description: Probe cadence. The operator also probes on apply and whenever the referenced Secret's content changes.
                type: string
              youtube:
                nullable: true
                properties:
                  apiKeySecretRef:
                    description: Optional Secret in the same namespace holding `api-key` for quota-backed YouTube Data API access. Public channel RSS and captions do not require a key.
                    nullable: true
                    properties:
                      name:
                        type: string
                    required:
                    - name
                    type: object
                type: object
            required:
            - kind
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  properties:
                    lastTransitionTime:
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    reason:
                      nullable: true
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              consumers:
                default:
                  apiKeys: 0
                  pipelines: 0
                properties:
                  apiKeys:
                    default: 0
                    format: int64
                    type: integer
                  pipelines:
                    default: 0
                    format: int64
                    type: integer
                type: object
              credentialRevision:
                description: sha256 over the referenced Secret's key material at the last probe. A different live revision means the Secret rotated and the operator re-verifies.
                nullable: true
                type: string
              failureReason:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                default: Pending
                description: PascalCase like every Kubernetes phase.
                enum:
                - Pending
                - Verified
                - Failed
                type: string
              sourceRevisions:
                additionalProperties:
                  type: string
                description: For source kinds whose revision is part of replayability, this maps declared source keys to the latest resolved upstream revision.
                type: object
              verifiedAt:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: Warehouse
        type: object
    served: true
    storage: true
    subresources:
      status: {}

