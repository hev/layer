# Every cloud: azure branch at once; layer on values-azure.yaml. Rendered and
# validated with kubeconform (see the PR) and kept here for the next change.
vectorStore:
  credential:
    apiKey: k
dashboard:
  basicAuth:
    password: p
  serviceAccount:
    clientId: 00000000-0000-0000-0000-000000000002
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/whitelist-source-range: 10.0.0.0/8
serviceAccount:
  clientId: 00000000-0000-0000-0000-000000000001
