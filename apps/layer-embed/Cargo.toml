[package]
name = "layer-embed"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
axum = "0.8"
http-body-util = "0.1"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.1"
safetensors = "=0.8.0"
sha2 = "0.10"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
