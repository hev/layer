          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VectorStore"
        '404':
          description: VectorStore not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: Kubernetes access is unavailable on this gateway
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
components:
  parameters:
    namespace:
      name: namespace
      in: path
      required: true
      schema:
        type: string
      description: Namespace name
    job_id:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      description: Ephemeral job ID
    scan_id:
      name: scan_id
      in: path
      required: true
      schema:
        type: string
      description: Scan job ID
    vectorstoreName:
      name: name
      in: path
      required: true
      schema:
        type: string
      description: VectorStore resource name
  headers:
    LayerStableAsOf:
      description: Epoch-ms consistency watermark the read was served at.
      schema:
        type: integer
        format: int64
    LayerNextCursor:
      description: Opaque pagination cursor for the next single-query page.
      schema:
        type: string
    LayerWarning:
      description: 'Non-fatal advisory about a request the gateway accepted but had
        to adjust. Present when the gateway silently dropped a field the caller asked
        for. Today only `vector_attribute_dropped` is defined: the caller listed `vector`
        in `include_attributes`, the gateway never returns vectors, so the field was
        removed from the response.

'
      schema:
        type: string
        enum:
        - vector_attribute_dropped
    LayerPartial:
      description: "`true` when a federated best-effort query returned successful
        namespace legs and reported one or more failed legs in `errors`.\n"
      schema:
        type: string
        enum:
        - 'true'
  schemas:
    LicenseSurfaceState:
      type: object
      required:
      - state
      - seconds_to_deadline
      - grace_seconds_remaining
      properties:
        state:
          type: string
          enum:
          - licensed
          - grace
          - floor
        seconds_to_deadline:
          type: integer
          format: int64
        grace_seconds_remaining:
          type: integer
          format: int64
    LicenseState:
      type: object
      required:
      - valid
      - gateway
      properties:
        valid:
          type: boolean
        state:
          type: string
          enum:
          - floor
          description: Present for missing or invalid license tokens.
        reason:
          type: string
          description: Missing/invalid reason when no valid token is configured.
        sub:
          type: string
        tier:
          type: string
        features:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties:
            type: integer
            format: int64
        exp:
          type: string
          format: date-time
        gateway:
          "$ref": "#/components/schemas/LicenseSurfaceState"
    Document:
      type: object
      required:
      - id
      - attributes
      properties:
        id:
          type: string
        attributes:
          type: object
          additionalProperties: true
    FetchDocumentsRequest:
      type: object
      required:
      - ids
      properties:
        ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Document IDs to retrieve
        include_attributes:
          type: array
          items:
            type: string
          description: Attributes to include. If omitted, all attributes are returned.
    FetchDocumentsResponse:
      type: object
      required:
      - documents
      - missing
      properties:
        documents:
          type: array
          items:
            "$ref": "#/components/schemas/Document"
        missing:
          type: array
          items:
            type: string
          description: IDs that were not found in the cache
    StatusResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
        message:
          type: string
        rows_affected:
          type: integer
          format: int64
        rows_upserted:
          type: integer
          format: int64
        rows_patched:
          type: integer
          format: int64
        rows_deleted:
          type: integer
          format: int64
        billing:
          type: object
          additionalProperties: true
    TurbopufferNamespaceSummary:
      type: object
      required:
      - id
      properties:
        id:
          type: string
    TurbopufferNamespaceList:
      type: object
      required:
      - namespaces
      properties:
        namespaces:
          type: array
          items:
            "$ref": "#/components/schemas/TurbopufferNamespaceSummary"
        next_cursor:
          type: string
    TurbopufferSchema:
      type: object
      additionalProperties: true
    TurbopufferMetadataPatch:
      type: object
      additionalProperties: true
      properties:
        pinning: {}
    TurbopufferWriteRequest:
      type: object
      additionalProperties: true
      description: Native Turbopuffer write body (`upsert_rows`, `patch_rows`, `deletes`,
        filter writes, copy, branch, schema, encryption, etc.).
    TurbopufferBranchFromRequest:
      type: object
      additionalProperties: true
      properties:
        branch_from_namespace:
          type: object
          additionalProperties: true
      required:
      - branch_from_namespace
    TurbopufferCopyFromRequest:
      type: object
      additionalProperties: true
      properties:
        copy_from_namespace:
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
      required:
      - copy_from_namespace
    TurbopufferWriteResponse:
      type: object
      required:
      - status
      - message
      - rows_affected
      - billing
      properties:
        status:
          type: string
        message:
          type: string
        rows_affected:
          type: integer
          format: int64
        rows_upserted:
          type: integer
          format: int64
        rows_patched:
          type: integer
          format: int64
        rows_deleted:
          type: integer
          format: int64
        rows_remaining:
          type: boolean
        upserted_ids:
          type: array
          items: {}
        patched_ids:
          type: array
          items: {}
        deleted_ids:
          type: array
          items: {}
        billing:
          type: object
          additionalProperties: true
        performance:
          type: object
          additionalProperties: true
    TurbopufferQueryRequest:
      type: object
      additionalProperties: true
      description: Native Turbopuffer query body (`rank_by`, `filters`, `aggregate_by`,
        `group_by`, `limit`, etc.).
    TurbopufferQueryResponse:
      type: object
      additionalProperties: true
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        aggregations:
          type: object
          additionalProperties: true
        aggregation_groups:
          type: array
          items:
            type: object
            additionalProperties: true
        billing:
          type: object
          additionalProperties: true
        performance:
          type: object
          additionalProperties: true
    BatchQueryRequest:
      type: object
      required:
      - queries
      properties:
        queries:
          type: array
          items:
            "$ref": "#/components/schemas/TurbopufferQueryRequest"
        consistency:
          type: object
          additionalProperties: true
        vector_encoding:
          type: string
    BatchQueryResponse:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          items:
            "$ref": "#/components/schemas/TurbopufferQueryResponse"
        billing:
          type: object
          additionalProperties: true
        performance:
          type: object
          additionalProperties: true
        stable_as_of:
          type:
          - integer
          - 'null'
          description: SDK field populated from the `x-layer-stable-as-of` response
            header.
    TurbopufferExplainQueryResponse:
      type: object
      properties:
        plan_text:
          type: string
    TurbopufferRecallRequest:
      type: object
      additionalProperties: true
      properties:
        num:
          type: integer
        top_k:
          type: integer
        filters: {}
        rank_by: {}
        include_ground_truth:
          type: boolean
    TurbopufferRecallResponse:
      type: object
      required:
      - avg_recall
      - avg_exhaustive_count
      - avg_ann_count
      properties:
        avg_recall:
          type: number
        avg_exhaustive_count:
          type: number
        avg_ann_count:
          type: number
        ground_truth:
          type: array
          items:
            type: object
            additionalProperties: true
    HintCacheWarmResponse:
      type: object
      description: 'With warm options supplied, reports per-step warm results (`namespace`,
        `turbopuffer`, `documents`, `snapshots`, `blobs`). With no query parameters
        the body is Turbopuffer''s own `hint_cache_warm` response, passed through
        verbatim — its shape is owned by upstream, so all per-step fields are absent.

'
      additionalProperties: true
      properties:
        namespace:
          type: string
        turbopuffer:
          "$ref": "#/components/schemas/WarmStepResponse"
        documents:
          "$ref": "#/components/schemas/WarmDocumentsResponse"
        snapshots:
          "$ref": "#/components/schemas/WarmSnapshotsResponse"
        blobs:
          "$ref": "#/components/schemas/WarmBlobsResponse"
    JobStatus:
      type: string
      enum:
      - running
      - completed
      - failed
    SnapshotSource:
      type: string
      enum:
      - auto
      - stored
      - cache
      - origin
    ScanSource:
      type: string
      enum:
      - auto
      - cache
      - origin
      - snapshot
      description: "`snapshot` applies to values scans only: the latest snapshot's
        pre-aggregated facet histogram. ID scans reject it at create time.\n"
    ScanCountSource:
      type: string
      enum:
      - auto
      - snapshot
      - cache
      - origin
    ScanMode:
      type: string
      enum:
      - ids
      - count
      - values
      default: ids
    ScanCountServedBy:
      type: string
      enum:
      - snapshot
      - cache
      - origin
    CreateSnapshotRequest:
      type: object
      required:
      - field
      properties:
        field:
          type: string
        source:
          "$ref": "#/components/schemas/SnapshotSource"
        filters:
          description: Optional Turbopuffer filter expression. Not supported with
            source `stored`.
        page_size:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
    SnapshotPolicy:
      type: object
      description: 'Automatic snapshot writer policy. Mirrors `Index.spec.snapshot`
        so the Kubernetes CR and API entry point use one vocabulary.

'
      properties:
        facetFields:
          type: array
          items:
            type: string
          default: []
          description: 'Facet fields to histogram. Empty disables the automatic writer
            for the namespace.

'
        interval:
          type: string
          default: 5m
          description: 'Minimum spacing between automatic snapshot writes after upstream-stable
            advances.

'
        retention:
          type: string
          default: never
          description: 'Retention window for snapshot bodies, or `never` to keep history.

'
    CreateScanRequest:
      type: object
      description: 'Carries at most one ranked selector (`fts`, `hybrid_text`, or
        `ann`). `filters` is the sole selector when no ranked selector is present,
        all rows when omitted, or an extra AND constraint on a ranked scan.

'
      properties:
        source:
          "$ref": "#/components/schemas/ScanCountSource"
        filters:
          description: 'Optional Turbopuffer filter expression. Standalone filter
            selector, or an additional AND constraint on a ranked scan.

'
        as_of:
          type: integer
          format: int64
          minimum: 0
          description: 'Epoch-ms temporal upper bound. Mutually exclusive with `between`.
            The gateway conjoins `_hevlayer_upserted_at <= as_of` with `filters` before
            evaluating the scan.

'
        between:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            format: int64
            minimum: 0
          description: 'Epoch-ms temporal window `[lo, hi]` interpreted as `lo < _hevlayer_upserted_at
            <= hi`. Mutually exclusive with `as_of` and requires `lo < hi`.

'
        fts:
          "$ref": "#/components/schemas/FtsScan"
        hybrid_text:
          "$ref": "#/components/schemas/HybridTextScan"
        ann:
          "$ref": "#/components/schemas/AnnScan"
        mode:
          "$ref": "#/components/schemas/ScanMode"
        field:
          type: string
          description: 'Values mode only: the attribute field to enumerate. Required
            for `mode: values`, rejected on other modes. Scalar string and integer
            attributes, plus arrays of strings (each element counts once per containing
            document).

'
        exhaustive:
          type: boolean
          default: false
          description: 'Ranked scans only. `false` runs one scatter/gather and lets
            saturated shards bound the result; `true` recurses saturated BM25 `fts`
            shards via score-band pagination until short or the deadline. HybridText
            and ANN scans do not use score-band pagination; saturated pages remain
            bounded.

'
        threads:
          type: integer
          minimum: 1
          description: 'Maximum concurrent upstream requests used by this scan''s
            origin scatter/gather. Omit to use `Index.spec.scan.threads`, then the
            gateway default. Values above the server cap are clamped and echoed in
            the response/job; ignored on snapshot and cache reads.

'
        page_size:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
          default: 30
          description: Count-mode deadline.
    FtsScan:
      type: object
      description: Full-text (BM25) scan selector. Exact; origin scatter/gather.
      required:
      - field
      - query
      properties:
        field:
          type: string
          description: BM25-indexed field to rank against.
        query:
          type: string
          description: User query string passed to BM25.
    HybridTextScan:
      type: object
      description: 'HybridText scan selector. Counts the de-duplicated union of the
        BM25 leg, the per-token fuzzy legs, and the per-token surfacing legs (the
        RFC 0057 fallback). The scan always evaluates all three sets, so its count
        is a superset of the `hybrid_text` query route''s deduped rows — the route
        only adds the surfacing legs when its primary legs return nothing. Origin
        scatter/gather.

'
      required:
      - field
      - query
      properties:
        field:
          type: string
          description: Full-text field to rank and fuzzy-match against.
        query:
          type: string
          description: User query passed through the HybridText tokenizer policy.
        fuzziness:
          description: 'Optional fuzziness policy: `"auto"`, `0`, `1`, or `2`.'
          oneOf:
          - type: string
            enum:
            - auto
          - type: integer
            minimum: 0
            maximum: 2
    AnnScan:
      type: object
      description: 'Radius (ANN) scan selector — rows within `radius` of `vector`,
        a distance-ball scan evaluated by approximate nearest-neighbour search. Approximate;
        origin scatter/gather.

'
      required:
      - vector
      - radius
      properties:
        vector:
          type: array
          items:
            type: number
          description: Query vector.
        field:
          type: string
          default: vector
          description: Vector field name.
        radius:
          type: number
          description: 'Required, finite upper bound on distance — the radius of the
            ball the scan counts. The gateway applies the bound to returned `$dist`
            rows; it is not pushed upstream as a filter.

'
    WarmStepStatus:
      type: string
      enum:
      - skipped
      - completed
      - started
      - no_snapshot
    WarmStepResponse:
      type: object
      required:
      - enabled
      - status
      properties:
        enabled:
          type: boolean
        status:
          "$ref": "#/components/schemas/WarmStepStatus"
    WarmDocumentsResponse:
      type: object
      required:
      - enabled
      - status
      properties:
        enabled:
          type: boolean
        status:
          "$ref": "#/components/schemas/WarmStepStatus"
        job:
          "$ref": "#/components/schemas/WarmJob"
    WarmSnapshotsResponse:
      type: object
      required:
      - enabled
      - status
      properties:
        enabled:
          type: boolean
        status:
          "$ref": "#/components/schemas/WarmStepStatus"
        key:
          type: string
          description: S3 key mirrored into Aerospike.
        watermark_ms:
          type: integer
          description: Snapshot consistency watermark.
        sha:
          type: string
          description: Snapshot content SHA-256.
    WarmBlobsResponse:
      type: object
      required:
      - enabled
      - status
      - documents_scanned
      - refs_seen
      - objects
      - bytes
      - missing
      - invalid_refs
      - budget_exhausted
      properties:
        enabled:
          type: boolean
        status:
          "$ref": "#/components/schemas/WarmStepStatus"
        attributes:
          type: array
          description: Declared document attributes scanned for blob references.
          items:
            type: string
        budget_bytes:
          type: integer
          description: Per-call blob byte budget.
        documents_scanned:
          type: integer
          description: Origin documents scanned while hydrating blobs.
        refs_seen:
          type: integer
          description: Valid blob references observed before deduplication.
        objects:
          type: integer
          description: Unique blob objects written into Aerospike.
        bytes:
          type: integer
          description: Blob bytes written into Aerospike.
        missing:
          type: integer
          description: Referenced blobs missing from durable S3 storage.
        invalid_refs:
          type: integer
          description: Values in declared attributes that were not valid same-namespace
            blob refs.
        budget_exhausted:
          type: boolean
          description: True when warm stopped before crossing `budget_bytes`.
    JobBase:
      type: object
      required:
      - id
      - namespace
      - status
      - progress
      - documents_scanned
      - created_at
      properties:
        id:
          type: string
        namespace:
          type: string
        status:
          "$ref": "#/components/schemas/JobStatus"
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 1
        documents_scanned:
          type: integer
        stable_as_of:
          type: integer
          description: Epoch-ms watermark associated with the job output.
        created_at:
          type: string
        completed_at:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
    SnapshotJob:
      allOf:
      - "$ref": "#/components/schemas/JobBase"
      - type: object
        required:
        - field
        - source
        properties:
          field:
            type: string
          source:
            "$ref": "#/components/schemas/SnapshotSource"
          effective_source:
            "$ref": "#/components/schemas/SnapshotSource"
          sha:
            type:
            - string
            - 'null'
    SnapshotJobList:
      type: object
      required:
      - snapshot_jobs
      properties:
        snapshot_jobs:
          type: array
          items:
            "$ref": "#/components/schemas/SnapshotJob"
    WarmJob:
      allOf:
      - "$ref": "#/components/schemas/JobBase"
    WarmJobList:
      type: object
      required:
      - warm_jobs
      properties:
        warm_jobs:
          type: array
          items:
            "$ref": "#/components/schemas/WarmJob"
    ScanJob:
      allOf:
      - "$ref": "#/components/schemas/JobBase"
      - type: object
        required:
        - mode
        - source
        properties:
          mode:
            "$ref": "#/components/schemas/ScanMode"
          field:
            type: string
            description: Values mode — the enumerated attribute field.
          source:
            "$ref": "#/components/schemas/ScanSource"
          effective_source:
            "$ref": "#/components/schemas/ScanSource"
          unique_values:
            type: integer
            format: int64
            description: 'Values mode — distinct values held by the completed job.

'
          truncated:
            type: boolean
            description: 'Values mode — the 1,000,000 distinct-value cap was crossed;
              the listing holds the top values by count, each with an exact count.

'
          bounded:
            type: boolean
            description: 'Ranked values scans — a shard saturated its `top_k` cap
              or the deadline elapsed, so per-value counts are `>=` lower bounds and
              the listing may be incomplete.

'
          approximate:
            type: boolean
            description: Ranked `ann` values scans — ANN recall error.
          snapshot_sha:
            type: string
            description: 'Snapshot-served values scans — content SHA of the snapshot
              body that answered the scan.

'
          watermark_ms:
            type: integer
            format: int64
            description: 'Snapshot-served values scans — the snapshot''s stable watermark.

'
          threads:
            type: integer
            format: int32
            description: 'Effective origin fan-out width. Present only when the scan
              job actually ran origin scatter/gather.

'
    ScanJobList:
      type: object
      required:
      - scans
      properties:
        scans:
          type: array
          items:
            "$ref": "#/components/schemas/ScanJob"
    ScanValue:
      type: object
      description: 'One distinct value of a values scan, in the snapshot body''s `{v,
        n}` vocabulary — `v` is the value, `n` its document count.

'
      required:
      - v
      - n
      properties:
        v:
          type: string
        n:
          type: integer
          format: int64
    ScanValuesResponse:
      type: object
      required:
      - values
      - total
      - truncated
      properties:
        values:
          type: array
          description: Ordered by `n` descending, then `v` ascending.
          items:
            "$ref": "#/components/schemas/ScanValue"
        total:
          type: integer
          format: int64
          description: Distinct values held by the job, before `limit`/`offset`.
        truncated:
          type: boolean
    ScanIdsResponse:
      type: object
      required:
      - ids
      - total
      properties:
        ids:
          type: array
          items:
            type: string
        total:
          type: integer
    ScanCountResponse:
      type: object
      required:
      - count
      - served_by
      - elapsed_ms
      properties:
        count:
          type: integer
          format: int64
        served_by:
          "$ref": "#/components/schemas/ScanCountServedBy"
        snapshot_sha:
          type: string
        watermark_ms:
          type: integer
          format: int64
        bounded:
          type: boolean
        timed_out:
          type: boolean
        shards_saturated:
          type: integer
          format: int64
        shards_total:
          type: integer
          format: int64
        approximate:
          type: boolean
          description: "`true` when the count carries ANN recall error (radius scans):
            the index's membership of the distance ball is itself fuzzy, independent
            of saturation. Absent (≡ exact) on filter and FTS scans.\n"
        threads:
          type: integer
          format: int32
          description: 'Effective origin fan-out width. Present only when the count
            ran origin scatter/gather; snapshot and cache reads do not fan out.

'
        elapsed_ms:
          type: integer
          format: int64
    NamespaceList:
      type: object
      description: 'Layer-augmented namespace list. Each entry is composed from the
        upstream Turbopuffer namespace list, per-namespace metadata, and the document
        cache. The shape is designed so a dashboard or `layer` CLI does not have to
        fan out across `/metadata` + `/health` for every row.

'
      required:
      - namespaces
      properties:
        namespaces:
          type: array
          items:
            "$ref": "#/components/schemas/NamespaceListEntry"
        next_cursor:
          type:
          - string
          - 'null'
          description: 'Opaque pagination cursor returned by the upstream namespace
            list. Present iff there are more pages.

'
    NamespaceListEntry:
      type: object
      description: 'Layer-augmented per-namespace row. Freshness fields come from
        the row''s metadata fetch; cache and shadow fields come from Layer state.
        When metadata is unavailable or lacks an index signal, `stable_as_of_ms` and
        `is_stable` are omitted, `cache_state.state` is `"cold"` when no cache demand
        has been observed, and `warm_inflight` is false.

'
      required:
      - name
      properties:
        name:
          type: string
          description: Namespace identifier as reported by Turbopuffer.
        row_count:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Approximate row count from upstream `approx_row_count`. `null`
            when per-namespace metadata could not be fetched.

'
        size_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Approximate logical byte size from upstream `approx_logical_bytes`.
            `null` when metadata is unavailable.

'
        stable_as_of_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Epoch-ms timestamp of this row''s stable metadata observation.
            Present when the per-row metadata fetch reports `index.status == "up-to-date"`.
            Null when metadata is unavailable, updating, or has no index signal.

'
        is_stable:
          type:
          - boolean
          - 'null'
          description: 'True when the per-row metadata fetch reports `index.status
            == "up-to-date"`, false when it reports `"updating"`, and null when metadata
            is unavailable or has no index signal.

'
        schema_summary:
          "$ref": "#/components/schemas/NamespaceSchemaSummary"
        index:
          "$ref": "#/components/schemas/IndexState"
        cache_state:
          "$ref": "#/components/schemas/NamespaceCacheState"
        last_write_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Epoch-ms timestamp of the most recent observed write. Sourced
            from upstream `last_write_at`; falls back to `stable_as_of_ms` when the
            upstream field is absent. Null when neither is available.

'
        shadow:
          type: boolean
          description: 'True when the namespace is a shadow/secondary index. The current
            convention is a `-shadow` suffix on the namespace name.

'
        labels:
          type: object
          additionalProperties:
            type: string
          description: 'User-set labels associated with the namespace, lifted from
            upstream metadata. Empty when none are set.

'
        metadata_error:
          type: string
          description: 'Present when the per-namespace metadata fetch failed for this
            row. The row is still returned (with name only) so the UI can render a
            "metadata unavailable" badge instead of dropping it.

'
    NamespaceSchemaSummary:
      type: object
      description: 'Minimal schema view for list responses. The full upstream schema
        is still available via `/v2/namespaces/{namespace}/metadata`.

'
      properties:
        vector_dim:
          type:
          - integer
          - 'null'
          description: 'Dimensions of the vector field, when one is present in the
            upstream schema. Null for namespaces without a vector column.

'
        fields:
          type: array
          items:
            type: string
          description: Top-level attribute names from the upstream schema.
    IndexState:
      type: object
      description: 'Turbopuffer''s `index` metadata object, passed through verbatim.
        The raw upstream per-fetch signal of how caught up indexing is. Namespace
        list rows derive `is_stable` and `stable_as_of_ms` from this same metadata
        fetch. Additional upstream sub-fields ride through unmodified.

'
      additionalProperties: true
      properties:
        status:
          type: string
          enum:
          - updating
          - up-to-date
          description: '`"up-to-date"` when the upstream index is fully caught up;
            `"updating"` while writes are still being indexed.

'
        unindexed_bytes:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Bytes written to the namespace''s write-ahead log but not
            yet indexed. Present only when `status == "updating"` (Turbopuffer omits
            it once caught up). Unindexed data is still searched by queries, so a
            non-zero value means "behind, but serving" — watch it fall to confirm
            indexing is draining rather than wedged.

'
    NamespaceCacheState:
      type: object
      description: 'Aerospike document-cache state for the namespace. Mirrors the
        per- namespace entries reported by `/health` so a single list call is enough
        to power dashboard fullness badges.

'
      required:
      - state
      - warm_inflight
      properties:
        state:
          type: string
          enum:
          - cold
          - warming
          - warm
        warmed_through_ms:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Epoch-ms watermark observed at the end of the last completed
            origin warm job. Null when no warm has completed yet.

'
        warm_inflight:
          type: boolean
          description: True when a background warm is currently running.
    NamespaceMetadata:
      type: object
      required:
      - id
      - schema
      - approx_logical_bytes
      - approx_row_count
      - created_at
      - updated_at
      properties:
        id:
          type: string
        schema:
          type: object
          additionalProperties: true
        approx_logical_bytes:
          type: integer
        approx_row_count:
          type: integer
        created_at:
          type: string
          format: date-time
        last_write_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type: string
          format: date-time
        config:
          type: object
          additionalProperties: true
        index:
          "$ref": "#/components/schemas/IndexState"
        layer:
          "$ref": "#/components/schemas/NamespaceMetadataLayer"
    NamespaceMetadataLayer:
      type: object
      description: Gateway-computed namespace freshness and readiness signals.
      properties:
        stable_as_of:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Epoch-ms watermark from the most recent stable consistency
            poll. Null before the watcher has observed a stable namespace.

'
        is_stable:
          type: boolean
          description: 'True when the most recent consistency poll observed `index.status
            == "up-to-date"`; false on cold start or while the upstream index is updating.

'
        indexed:
          type:
          - boolean
          - 'null'
          description: 'True when the latest snapshot''s indexed-row count is greater
            than or equal to the upstream namespace row count. False while vector
            rows are still missing from the indexed snapshot. Null for namespaces
            without a vector column, when the latest stored snapshot predates row-count
            capture, or when the snapshot lookup fails.

'
        index_lag_rows:
          type:
          - integer
          - 'null'
          format: int64
          description: 'Upstream namespace row count minus latest snapshot row count,
            clamped at zero. Null when `indexed` is null.

'
        schema_version:
          type: integer
          format: int64
          description: Layer reserved schema version stamped by namespace init.
        init_state:
          type: string
          enum:
          - running
          - ready
          description: Embedded namespace init drain state.
        init_lag_rows:
          type: integer
          format: int64
          description: Rows still missing init-owned reserved fields.
        shard_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Persisted namespace shard count, or null for unsharded namespaces.
        shard_state:
          type: string
          enum:
          - unsharded
          - backfilling
          - ready
          description: Shard backfill readiness state.
        shard_lag_rows:
          type: integer
          format: int64
          description: Rows still missing `_hevlayer_shard`.
        scatter_gather_active:
          type: boolean
          description: True iff a shard marker exists and `shard_lag_rows` is zero.
    InitNamespaceRequest:
      type: object
      properties:
        schema_version:
          type: integer
          format: int64
          minimum: 1
          default: 1
          description: Layer reserved schema version to stamp on the namespace marker.
        shard_count:
          type: integer
          format: int64
          minimum: 1
          description: Number of `_hevlayer_shard` buckets to backfill.
    InitNamespaceResponse:
      type: object
      required:
      - namespace
      - layer
      properties:
        namespace:
          type: string
        layer:
          "$ref": "#/components/schemas/NamespaceMetadataLayer"
    QueryRequest:
      type: object
      description: |
        Vector query request body. Caller must supply exactly one of `vector` (raw query vector) or `nearest_to_id` (an array of document ids; the gateway resolves each vector via Aerospike, falling back to the namespace's configured VectorStore on miss, and averages them into a centroid query vector). The gateway may add a consistency watermark filter before forwarding to that store.
        `vector` is never returned in `attributes`. Listing `"vector"` in `include_attributes` causes the gateway to drop the field and set `x-layer-warning: vector_attribute_dropped` on the response.
      properties:
        vector:
          type: array
          items:
            type: number
          minItems: 1
          description: 'Query vector. Mutually exclusive with `nearest_to_id`; exactly
            one of the two is required.

'
        nearest_to_id:
          type: array
          items:
            type: string
          minItems: 1
          description: 'Document ids whose stored vectors are averaged component-wise
            into the centroid query vector. Mutually exclusive with `vector`; exactly
            one of the two is required, and the array must be non-empty. The gateway
            looks each vector up in Aerospike and falls back to the namespace''s configured
            VectorStore (with a cache backfill) on miss. Returns 404 naming any ids
            with no vector in either place.

'
        top_k:
          type: integer
          minimum: 1
          default: 10
          description: Number of nearest neighbors to return.
        filters:
          description: Turbopuffer filter expression.
        as_of:
          type: integer
          format: int64
          minimum: 0
          description: 'Epoch-ms temporal upper bound. Mutually exclusive with `between`.
            The gateway conjoins `_hevlayer_upserted_at <= as_of` with the caller
            filter before querying.

'
        between:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            format: int64
            minimum: 0
          description: 'Epoch-ms temporal window `[lo, hi]` interpreted as `lo < _hevlayer_upserted_at
            <= hi`. Mutually exclusive with `as_of` and requires `lo < hi`.

'
        include_attributes:
          oneOf:
          - type: boolean
          - type: array
            items:
              type: string
          description: 'Attributes to include in each result. `vector` is always stripped
            from the response; explicitly listing it triggers an `x-layer-warning`
            header.

'
        include_leg_breakdown:
          type: boolean
          default: false
          description: 'Opt in to per-row `$fused.legs` provenance on Layer-expanded
            fused responses (`HybridText`, and executed `Auto` routes that expand
            hybrid-text legs). Each leg entry names the effective leg (`bm25`, `fuzzy:<token>`,
            or `semantic`) and reports that row''s 1-based rank plus raw per-leg score/distance;
            `rank` and `score` are null when the row fell outside that leg''s `per_leg_limit`
            cut. Default false, so payload and unsharded query fan-out are unchanged
            for callers that do not ask.

'
        cursor:
          type: string
          description: 'Opaque pagination token returned by a prior response''s `next_cursor`.
            Resumes the same ranked query at the row that follows. Caller should treat
            as opaque. Native vector queries decode it into a `($dist > last OR ($dist
            == last AND id > last_id))` band filter. Layer-fused `HybridText` and
            executed `Auto` routes decode it into a bounded server-side re-fetch offset
            capped at 10,000 ranked rows.

'
        rank_by:
          type: array
          items: {}
          description: 'Rank expression tuple. With `top_k`, Layer handles the portable
            subset with cache, history, and stable-read behavior; native upstream
            `rank_by` bodies that omit `top_k` pass through unchanged. For search-store
            multivector namespaces, spell ANN over a vector bag as `["vectors", "ANN",
            [[...], [...]]]`. Two Layer-only operator spellings are intercepted: `["field",
            "HybridText", "input", {fuzziness?, rank_constant?, per_leg_limit?, threads?}?]`
            (hybrid text fusion, RFC 0022; `threads` is the same scatter/gather fan-out
            control as scans, defaulting from `Index.spec.scan.threads`) and `["field",
            "Auto", "input", {route?, vector?}?]` (query router, RFC 0044). When `rank_by`
            is present, `vector` and `nearest_to_id` must be absent.

'
    FederatedQueryRequest:
      allOf:
      - "$ref": "#/components/schemas/QueryRequest"
      - type: object
        properties:
          namespaces:
            type: array
            minItems: 1
            maxItems: 512
            items:
              type: string
              minLength: 1
            description: 'Explicit namespace set to query. `["*"]`, or omitting this
              field, expands the authenticated key''s namespace allowlist.

'
          strict:
            type: boolean
            default: false
            description: 'Fail the whole request on the first namespace leg error.
              Default false returns successful namespace legs and reports failed legs
              in `errors`.

'
          fusion:
            "$ref": "#/components/schemas/FederatedFusionOptions"
    FederatedFusionOptions:
      type: object
      properties:
        per_namespace_limit:
          type: integer
          minimum: 1
          description: 'Rows each namespace returns to the cross-namespace merge.
            Default is `clamp(2 * top_k, 10, 100)`.

'
        rank_constant:
          type: integer
          minimum: 1
          default: 60
          description: 'Reserved RRF constant echo. Inert on rank-interleave text
            routes.

'
    FederatedQueryResponse:
      type: object
      required:
      - rows
      - merge
      - namespaces
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
          description: 'Fused rows. Every row includes `id`, `$namespace`, `$rank`,
            and route-native `$dist`/`$score` plus requested attributes when present.

'
        merge:
          type: object
          required:
          - method
          - route
          properties:
            method:
              type: string
              enum:
              - distance
              - rank-interleave
              - weighted-rrf
            route:
              type: string
              enum:
              - fused
              - dual-score
            downgraded_reason:
              type: string
              enum:
              - missing_embedding_profile
              - embedding_profile_mismatch
              description: 'Present when a vector route could not safely merge by
                raw distance and fell back to rank-interleave in best-effort mode.

'
        routing:
          "$ref": "#/components/schemas/RoutingEcho"
        hybrid:
          "$ref": "#/components/schemas/HybridEcho"
        namespaces:
          type: array
          items:
            "$ref": "#/components/schemas/FederatedNamespaceResult"
        errors:
          type: array
          items:
            "$ref": "#/components/schemas/FederatedNamespaceError"
    FederatedNamespaceResult:
      type: object
      required:
      - namespace
      - matched
      properties:
        namespace:
          type: string
        stable_as_of:
          type:
          - integer
          - 'null'
          format: int64
        matched:
          type: integer
          minimum: 0
    FederatedNamespaceError:
      type: object
      required:
      - namespace
      - error
      properties:
        namespace:
          type: string
        error:
          type: string
    HybridEcho:
      type: object
      required:
      - tokens
      - tokens_dropped
      - fuzziness
      - rank_constant
      - legs
      - per_leg_limit
      description: 'Effective hybrid-text expansion, echoed so defaults are never
        invisible. Present on `HybridText` responses and on routed responses whose
        route expanded hybrid-text legs.

'
      properties:
        tokens:
          type: array
          items:
            type: string
          description: Tokens that produced fuzzy legs, post tokenizer policy.
        tokens_dropped:
          type: integer
          description: 'Tokens removed by the 15-token cap (not by the length or punctuation
            rules).

'
        fuzziness:
          oneOf:
          - type: string
            enum:
            - auto
          - type: integer
            enum:
            - 0
            - 1
            - 2
          description: Effective fuzziness setting.
        rank_constant:
          type: integer
          description: Upstream RRF rank constant, passed through verbatim.
        legs:
          type: integer
          description: 'Total effective subqueries in the fused expansion. On the
            normal path this is the fuzzy legs + 1 BM25 leg (+ 1 ANN leg on the fused
            route). On the RFC 0057 surfacing fallback (`surfaced: true`) there is
            no BM25 leg, so `legs` equals the token count (one fuzzy leg per token).

'
        per_leg_limit:
          type: integer
          description: How deep each leg retrieved before fusion.
        surfaced:
          type: boolean
          description: 'Present and `true` only when the RFC 0057 empty-result fallback
            fired: the primary expansion fused to zero rows (e.g. a fully-misspelled
            query), so the gateway re-ran one fuzzy leg per token, ranked each by
            field/token edit distance, and fused those instead. Absent on the normal
            path.

'
        threads:
          type: integer
          description: 'Effective scatter/gather fan-out width (the scans `threads`
            control, clamped to active shards). Present only on sharded namespaces,
            where the gateway fans each leg out per shard.

'
    RoutingEcho:
      type: object
      required:
      - route
      - policy
      - tokens
      - executed
      description: Query-router decision block, present on every `Auto` response.
      properties:
        route:
          type: string
          enum:
          - hybrid_text
          - semantic
          - fused
          description: The strategy chosen (or forced).
        policy:
          type: string
          description: 'Routing policy version that made the decision (`v1`), or `forced`
            when the request supplied `route`.

'
        tokens:
          type: integer
          description: Token count the policy read, post tokenizer policy.
        executed:
          type: boolean
          description: "`false` on a deferral — the route needs a vector the request
            did not supply. `rows` is empty; embed and re-issue with the route forced.\n"
    QueryResponse:
      type: object
      additionalProperties: true
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
          description: Upstream Turbopuffer query rows (`id`, `$dist`/`$score`, and
            flat attributes).
        aggregations:
          type: object
          additionalProperties: true
        aggregation_groups:
          type: array
          items:
            type: object
            additionalProperties: true
        billing:
          type: object
          additionalProperties: true
        performance:
          type: object
          additionalProperties: true
        stable_as_of:
          type:
          - integer
          - 'null'
          description: SDK field populated from the `x-layer-stable-as-of` response
            header.
        next_cursor:
          type:
          - string
          - 'null'
          description: 'Pagination token, always present in the response body and
            mirrored in the `x-layer-next-cursor` response header. Holds the next
            page token when the response returned a full `top_k` page (i.e. there
            *might* be more results), and is `null` on the last page (the header is
            then omitted). Pass a non-null value back in the next `QueryRequest.cursor`.

'
        hybrid:
          "$ref": "#/components/schemas/HybridEcho"
        routing:
          "$ref": "#/components/schemas/RoutingEcho"
    Error:
      type: object
      required:
      - error
      - message
      properties:
        error:
          type: string
        message:
          type: string
    MetricKind:
      type: string
      enum:
      - counter
      - gauge
      - histogram
      description: Prometheus metric type.
    MetricFamily:
      type: string
      enum:
      - query
      - upsert
      - fetch
      - cache
      - pipeline
      - storage
      - saturation
      description: 'Logical grouping used by the dashboard''s observe pane sidebar.
        Assigned explicitly on every `MetricDoc`, not derived from the name prefix.

'
    MetricAlert:
      type: object
      required:
      - summary
      - expr
      - for
      properties:
        summary:
          type: string
          description: Short human-readable description of what the alert catches.
        expr:
          type: string
          description: PromQL expression that triggers the alert when true.
        for:
          type: string
          description: Sustained duration before the alert fires (Prometheus duration
            syntax).
    MetricCatalogEntry:
      type: object
      required:
      - name
      - kind
      - family
      - labels
      - description
      - example_promql
      properties:
        name:
          type: string
          description: Prometheus metric name.
        kind:
          "$ref": "#/components/schemas/MetricKind"
        family:
          "$ref": "#/components/schemas/MetricFamily"
        labels:
          type: array
          items:
            type: string
          description: Label keys this metric carries.
        description:
          type: string
          description: One-line operator-facing description.
        example_promql:
          type: string
          description: Example PromQL query that exercises this metric.
        alert:
          "$ref": "#/components/schemas/MetricAlert"
    MetricCatalog:
      type: object
      required:
      - version
      - entries
      properties:
        version:
          type: string
          description: Catalog schema version; bumps on incompatible JSON shape changes.
        entries:
          type: array
          items:
            "$ref": "#/components/schemas/MetricCatalogEntry"
          description: Catalog entries, sorted by `name`.
    PrometheusResponse:
      type: object
      description: Raw Prometheus HTTP API JSON response.
      additionalProperties: true
    KubernetesCondition:
      type: object
      additionalProperties: true
      description: Kubernetes-style condition object projected from CRD status.
    SecretKeyRef:
      type: object
      required:
      - name
      - key
      properties:
        name:
          type: string
          description: Secret name in the same namespace as the resource.
        key:
          type: string
          description: Secret data key. The value is never returned.
    VectorStoreEndpoint:
      type: object
      required:
      - url
      - region
      properties:
        url:
          type: string
          description: Upstream vector-store API base URL.
        region:
          type: string
          description: Operator-visible region label for this store.
    VectorStoreTurbopuffer:
      type: object
      required:
      - orgId
      properties:
        orgId:
          type: string
          description: 'Turbopuffer organization id used only for dashboard deep links
            and support orientation. It is not used for auth or routing.

'
    VectorStoreCredential:
      type: object
      required:
      - secretRef
      properties:
        secretRef:
          "$ref": "#/components/schemas/SecretKeyRef"
    VectorStoreInboundAuth:
      type: object
      properties:
        mode:
          type: string
          enum:
          - deriveFromStore
          - keys
          - open
    VectorStoreStatus:
      type: object
      required:
      - conditions
      properties:
        reachable:
          type: boolean
        observedGeneration:
          type: integer
          format: int64
        conditions:
          type: array
          items:
            "$ref": "#/components/schemas/KubernetesCondition"
    VectorStore:
      type: object
      required:
      - name
      - kind
      - default
      - endpoint
      - credential
      - status
      properties:
        name:
          type: string
        kind:
          type: string
          description: Store kind; `turbopuffer` is the implemented v1 kind.
        default:
          type: boolean
          description: 'True when this store is the default for indexes that omit
            `spec.backend.storeRef`.

'
        endpoint:
          "$ref": "#/components/schemas/VectorStoreEndpoint"
        turbopuffer:
          "$ref": "#/components/schemas/VectorStoreTurbopuffer"
        credential:
          "$ref": "#/components/schemas/VectorStoreCredential"
        inboundAuth:
          "$ref": "#/components/schemas/VectorStoreInboundAuth"
        status:
          "$ref": "#/components/schemas/VectorStoreStatus"
        turbopufferUrl:
          type: string
          description: 'Gateway-computed Turbopuffer dashboard URL. Omitted when `turbopuffer.orgId`
            is absent.

'
    VectorStoreList:
      type: object
      required:
      - vectorstores
      properties:
        vectorstores:
          type: array
          items:
            "$ref": "#/components/schemas/VectorStore"
