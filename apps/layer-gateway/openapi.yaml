  "/v2/namespaces/{namespace}/query":
    post:
      operationId: queryNamespace
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      x-hevlayer-client-aliases:
      - operationId: batchQueryNamespace
        upstreamKey: POST /v2/namespaces/{namespace}/query?stainless_overload=multiQuery
        query:
          stainless_overload: multiQuery
        requestBodySchema:
          "$ref": "#/components/schemas/BatchQueryRequest"
        responseSchema:
          "$ref": "#/components/schemas/BatchQueryResponse"
      summary: Query a namespace by vector, document id, or Layer rank expression
      description: |
        Query nearest neighbors in a namespace. The caller supplies either a raw `vector` or `nearest_to_id` (an array of document ids; the gateway looks up each document's vector from the Aerospike cache, falling back to the namespace's configured VectorStore on miss with a cache backfill, and averages the resolved vectors component-wise into a single centroid query vector). The gateway forwards the vector search to that store and may inject a consistency watermark filter while the upstream index is updating. Query bypasses the document cache for results; cache-status telemetry is absent for this endpoint.
        Two Layer-only `rank_by` spellings are intercepted ahead of passthrough. `["field", "HybridText", "input", {options}?]` runs hybrid text fusion: the gateway tokenizes the input (alyze, the `word_v4` tokenizer), expands one BM25 leg plus one fuzzy leg per token, and fuses them with RRF; the response carries a `hybrid` echo block. With `include_leg_breakdown: true`, fused rows also carry `$fused.legs` entries naming the BM25, fuzzy-token, and semantic legs that ranked the row. `["field", "Auto", "input", {route?, vector?}?]` runs the query router: the route (`hybrid_text`, `semantic`, or `fused`) is chosen from the token count alone, and a vectorless request routed `semantic`/`fused` returns a deferral (`routing` block with `executed: false`, empty `rows`) so the application can embed and re-issue with the route forced. All other bodies — including native multi-query + `rerank_by` — pass through unchanged.
        The `vector` column is never returned in `attributes`; if a caller lists `vector` in `include_attributes`, the gateway strips it and sets `x-layer-warning: vector_attribute_dropped` on the response.
      tags:
      - namespaces
      - query
      parameters:
      - "$ref": "#/components/parameters/namespace"
      - name: x-hevlayer-search-query
        in: header
        required: false
        schema:
          type: string
        description: 'Human query text to record in search history as `raw_query`.
          Keep search text here rather than encoding it as a tag.

'
      - name: x-hevlayer-tags
        in: header
        required: false
        schema:
          type: string
        description: 'Comma-separated search-history tags. Layer trims, sorts, and
          dedupes tags before storing them. Up to 32 unique tags are accepted; each
          tag is at most 128 bytes and may contain ASCII letters, digits, '':'', ''_'',
          ''-'', ''.'', ''/'', ''='', or ''+''. Commas separate tags and cannot be
          escaped.

'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/QueryRequest"
      responses:
        '200':
          description: Upstream-shaped query rows; Layer read metadata is returned
            in headers.
          headers:
            traceparent:
              schema:
                type: string
              description: Trace context generated or propagated for search/clickstream
                correlation.
            x-layer-stable-as-of:
              "$ref": "#/components/headers/LayerStableAsOf"
            x-layer-next-cursor:
              "$ref": "#/components/headers/LayerNextCursor"
            x-layer-warning:
              "$ref": "#/components/headers/LayerWarning"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/QueryResponse"
        '404':
          description: "`nearest_to_id` was supplied but one or more of the referenced
            documents has no vector in Aerospike or the configured VectorStore. The
            error names the missing ids.\n"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: 'Request validation error. Returned when neither `vector` nor
            `nearest_to_id` is supplied, both are supplied, or `nearest_to_id` is
            an empty array. For `HybridText`/`Auto` expressions: the input yields
            zero tokens under the tokenizer policy, the expression appears inside
            a `queries` body, an option is out of range, the fused cursor exceeds
            the bounded depth, or a forced `semantic`/`fused` route lacks a `vector`.

'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: VectorStore query failed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
