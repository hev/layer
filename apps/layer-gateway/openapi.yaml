---
openapi: 3.1.0
info:
  title: Hevlayer API
  description: 'Hevlayer-specific endpoints that extend the Turbopuffer API. These
    endpoints are not part of the Turbopuffer client — they are added by the Hevlayer
    proxy layer for document retrieval (cache), document cache operations, snapshot
    jobs, scans, result counts, and namespace metadata.

'
  version: 0.1.0
  contact:
    name: Hev
    url: https://github.com/hev/hevlayer
servers:
- url: http://localhost:8080
  description: Local development
- url: http://hevlayer.internal:8080
  description: In-cluster (Kubernetes)
security:
- bearerAuth: []
paths:
  "/v2/namespaces/{namespace}/documents/{doc_id}":
    get:
      operationId: fetchDocument
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Fetch a single document by ID
      description: |
        Retrieve a document by ID. On Aerospike cache miss, Hevlayer fetches the document from the namespace's configured VectorStore, writes it into Aerospike, and returns it.
        Known limitation: if Aerospike itself is unavailable, Hevlayer returns 503 instead of bypassing cache and reading directly from the configured VectorStore.
        Returns 404 if the document does not exist upstream. Returns 503 if the cache is unavailable.
      tags:
      - documents
      parameters:
      - "$ref": "#/components/parameters/namespace"
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
        description: Document ID
      - name: include_attributes
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Attributes to include in the response. If omitted, all attributes
          are returned.
      responses:
        '200':
          description: Document found
          headers:
            x-layer-cache:
              schema:
                type: string
                enum:
                - hit
                - miss
                - miss-on-error
              description: Cache serving status for the fetch.
            x-layer-warning:
              "$ref": "#/components/headers/LayerWarning"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Document"
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: Cache unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v2/namespaces/{namespace}/documents":
    post:
      operationId: fetchDocuments
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Fetch multiple documents by ID
      description: |
        Batch retrieve documents by ID. On Aerospike cache miss, Hevlayer fetches missing documents from the namespace's configured VectorStore, writes them into Aerospike, and returns found documents plus a list of true upstream misses.
        Known limitation: if Aerospike itself is unavailable, Hevlayer returns 503 instead of bypassing cache and reading directly from the configured VectorStore.
      tags:
      - documents
      parameters:
      - "$ref": "#/components/parameters/namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FetchDocumentsRequest"
      responses:
        '200':
          description: Documents retrieved
          headers:
            x-layer-cache:
              schema:
                type: string
                enum:
                - hit
                - miss
                - miss-on-error
                - partial
              description: Worst-case cache serving status across the batch.
            x-layer-warning:
              "$ref": "#/components/headers/LayerWarning"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FetchDocumentsResponse"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: Cache unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/namespaces/{namespace}/hint_cache_warm":
    get:
      operationId: hintCacheWarm
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      x-turbopuffer-key: GET /v1/namespaces/{namespace}/hint_cache_warm
      summary: Warm namespace caches
      description: 'Turbopuffer-compatible warm-cache endpoint. With no query parameters,
        this is a raw upstream-compatible `hint_cache_warm` passthrough and the response
        body is Turbopuffer''s own, returned verbatim. When any warm option (`turbopuffer`,
        `documents`, `snapshots`, `blobs`, `blob_budget_bytes`, `page_size`) is supplied,
        the gateway runs Layer warm steps — forward the warm hint to Turbopuffer,
        start an asynchronous warm job that populates Aerospike, mirror the latest
        S3 snapshot body into Aerospike, and optionally hydrate declared blob references
        from S3 into Aerospike — and returns per-step results. Document, snapshot,
        and Turbopuffer steps default on once any option is supplied and are independently
        toggleable. Blob hydration is explicit: callers must pass `blobs=true` plus
        `blob_budget_bytes`.

'
      tags:
      - cache
      parameters:
      - "$ref": "#/components/parameters/namespace"
      - name: turbopuffer
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Forward `hint_cache_warm` to Turbopuffer.
      - name: documents
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Start a warm job to backfill Aerospike from origin.
      - name: snapshots
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Mirror the latest S3 snapshot body into Aerospike.
      - name: blobs
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Hydrate declared blob references from S3 into Aerospike.
      - name: blob_budget_bytes
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Required byte budget when `blobs=true`; warm stops before crossing
          this budget.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
        description: Page size for the document-cache warm job.
      responses:
        '200':
          description: Warm request accepted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HintCacheWarmResponse"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: 'Cache unavailable (`cache_cold`). Returned only when `documents`
            or `snapshots` is requested while the cache is down; the bare passthrough
            does not touch the gateway cache.

'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/namespaces":
    get:
      operationId: listTurbopufferNamespaces
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      x-turbopuffer-key: GET /v1/namespaces
      summary: List Turbopuffer namespaces
      description: Raw Turbopuffer-compatible namespace listing passthrough.
      tags:
      - turbopuffer
      - namespaces
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: prefix
        in: query
        required: false
        schema:
          type: string
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        '200':
          description: Namespaces listed in Turbopuffer's native shape
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TurbopufferNamespaceList"
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/namespaces/{namespace}/schema":
    get:
      operationId: getTurbopufferNamespaceSchema
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      x-turbopuffer-key: GET /v1/namespaces/{namespace}/schema
      summary: Get Turbopuffer namespace schema
      tags:
      - turbopuffer
      - namespaces
      parameters:
      - "$ref": "#/components/parameters/namespace"
      responses:
        '200':
          description: Namespace schema
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TurbopufferSchema"
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    post:
      operationId: updateTurbopufferNamespaceSchema
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      x-turbopuffer-key: POST /v1/namespaces/{namespace}/schema
      summary: Update Turbopuffer namespace schema
      tags:
      - turbopuffer
      - namespaces
      parameters:
      - "$ref": "#/components/parameters/namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TurbopufferSchema"
      responses:
        '200':
          description: Updated namespace schema
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TurbopufferSchema"
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/namespaces/{namespace}/metadata":
    get:
      operationId: getTurbopufferV1NamespaceMetadata
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      x-turbopuffer-key: GET /v1/namespaces/{namespace}/metadata
      summary: Get Turbopuffer v1 namespace metadata
      tags:
      - turbopuffer
      - namespaces
      parameters:
      - "$ref": "#/components/parameters/namespace"
      responses:
        '200':
          description: Namespace metadata
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NamespaceMetadata"
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      operationId: updateTurbopufferNamespaceMetadata
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      x-turbopuffer-key: PATCH /v1/namespaces/{namespace}/metadata
      summary: Update Turbopuffer namespace metadata
      description: Raw passthrough for upstream metadata configuration, currently
        used for namespace pinning.
      tags:
      - turbopuffer
      - namespaces
      parameters:
      - "$ref": "#/components/parameters/namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TurbopufferMetadataPatch"
      responses:
        '200':
          description: Updated namespace metadata
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NamespaceMetadata"
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v1/namespaces/{namespace}/_debug/recall":
    post:
      operationId: evaluateTurbopufferRecall
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      x-turbopuffer-key: POST /v1/namespaces/{namespace}/_debug/recall
      summary: Evaluate Turbopuffer recall
      tags:
      - turbopuffer
      - namespaces
      parameters:
      - "$ref": "#/components/parameters/namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TurbopufferRecallRequest"
      responses:
        '200':
          description: Recall metrics
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TurbopufferRecallResponse"
        '502':
          description: Upstream error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v2/namespaces/{namespace}/snapshots":
    post:
      operationId: createSnapshot
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Materialize a snapshot for a field
      description: 'Create an on-demand snapshot job for one field. Jobs that resolve
        to `source: origin` use the same bounded shard fan-out as origin scans, with
        width resolved from `Index.spec.scan.threads` and the gateway default. Stored
        and cache reads do not fan out.

'
      tags:
      - snapshots
      parameters:
      - "$ref": "#/components/parameters/namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateSnapshotRequest"
      responses:
        '202':
          description: Snapshot job created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SnapshotJob"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: Cache unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v2/namespaces/{namespace}/snapshot-policy":
    get:
      operationId: getSnapshotPolicy
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Get snapshot policy
      description: 'Return the API-managed snapshot policy for a namespace. The JSON
        shape mirrors `Index.spec.snapshot`: `facetFields`, `interval`, and `retention`.

'
      tags:
      - snapshots
      parameters:
      - "$ref": "#/components/parameters/namespace"
      responses:
        '200':
          description: Snapshot policy
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SnapshotPolicy"
        '404':
          description: Snapshot policy not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    put:
      operationId: putSnapshotPolicy
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Set snapshot policy
      description: 'Set the API-managed snapshot policy for a namespace. This is the
        shared-gateway/API-only entry point for the same policy shape carried by `Index.spec.snapshot`.

'
      tags:
      - snapshots
      parameters:
      - "$ref": "#/components/parameters/namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/SnapshotPolicy"
      responses:
        '200':
          description: Snapshot policy saved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SnapshotPolicy"
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '502':
          description: S3 error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v2/namespaces/{namespace}/snapshot-jobs":
    get:
      operationId: listSnapshotJobs
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: List snapshot jobs
      tags:
      - snapshots
      parameters:
      - "$ref": "#/components/parameters/namespace"
      responses:
        '200':
          description: Snapshot jobs listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SnapshotJobList"
  "/v2/namespaces/{namespace}/snapshot-jobs/{job_id}":
    get:
      operationId: getSnapshotJob
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Get snapshot job status
      tags:
      - snapshots
      parameters:
      - "$ref": "#/components/parameters/namespace"
      - "$ref": "#/components/parameters/job_id"
      responses:
        '200':
          description: Snapshot job status
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SnapshotJob"
        '404':
          description: Snapshot job not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v2/namespaces/{namespace}/warm":
    post:
      operationId: warmCache
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Warm the Aerospike cache
      description: 'Starts an asynchronous warm job that pages through Turbopuffer
        and batch-populates the Aerospike cache.

'
      tags:
      - cache
      parameters:
      - "$ref": "#/components/parameters/namespace"
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
      responses:
        '202':
          description: Cache warm job created and started
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WarmJob"
        '422':
          description: Validation error (`page_size` out of range)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: Cache unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v2/namespaces/{namespace}/warm-jobs":
    get:
      operationId: listWarmJobs
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: List warm jobs
      tags:
      - cache
      parameters:
      - "$ref": "#/components/parameters/namespace"
      responses:
        '200':
          description: Warm jobs listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WarmJobList"
  "/v2/namespaces/{namespace}/warm-jobs/{job_id}":
    get:
      operationId: getWarmJob
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Get warm job status
      tags:
      - cache
      parameters:
      - "$ref": "#/components/parameters/namespace"
      - "$ref": "#/components/parameters/job_id"
      responses:
        '200':
          description: Warm job status
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WarmJob"
        '404':
          description: Warm job not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v2/namespaces/{namespace}/scans":
    post:
      operationId: createScan
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Create a scan (filter, full-text, or radius)
      description: |
        On-demand row selection over a namespace. A scan picks rows by one of three selectors and returns their IDs (`mode: ids`, async job), their count (`mode: count`, synchronous), or the distinct values of one attribute `field` with per-value counts (`mode: values`, async job):
        - `filters` — an attribute predicate, or all rows when omitted with
          no ranked selector. Exact. Count and values modes resolve
          snapshot / cache / origin; IDs mode iterates cache / origin.

        - `fts` — a full-text (BM25) predicate. Exact. Origin scatter/gather.
        - `hybrid_text` — counts the de-duplicated union of the BM25 leg, the
          per-token fuzzy legs, and the per-token surfacing legs (one fuzzy leg
          per token from the RFC 0057 fallback). The scan always evaluates all
          three sets, so its count is a superset of the `hybrid_text` query
          route's deduped rows: on a query whose primary legs return rows the
          route never adds the surfacing legs, so the scan can count more.
          Origin scatter/gather.

        - `ann` — a vector **radius** selector: rows within `radius` of a
          query vector. Approximate (ANN recall). Origin scatter/gather.

        At most one ranked selector (`fts`, `hybrid_text`, or `ann`) may be present; `filters` rides alongside any of them as an extra AND constraint. Ranked selectors support `mode: count` and `mode: values` and run origin scatter/gather, so `source` must be omitted, `auto`, or `origin`. Ranked scans honor `exhaustive` (default `false`) and a deadline (`timeout_seconds`, default 30s, server max 300s).
        Values scans cap at 1,000,000 distinct values per job. The cap is applied after the full pass — retained values keep exact counts and the listing truncates deterministically to the top values by count (value-asc tiebreak), flagged `truncated: true`. A snapshot-served values scan (unfiltered, field present in the latest snapshot `fields[]`) completes during the create call: the `202` body already carries the final state with `effective_source: snapshot`, `snapshot_sha`, and `watermark_ms`.
      tags:
      - scans
      parameters:
      - "$ref": "#/components/parameters/namespace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateScanRequest"
      responses:
        '200':
          description: Count-mode scan result
          headers:
            x-layer-stable-as-of:
              "$ref": "#/components/headers/LayerStableAsOf"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScanCountResponse"
        '202':
          description: 'ID or values scan created. Snapshot-served values scans return
            with `status: completed` and results readable immediately.

'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScanJob"
        '412':
          description: 'Snapshot source requested but the latest snapshot does not
            cover the request — count filter not snapshot-eligible, values scan carrying
            filters, or values `field` not pre-aggregated.

'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '422':
          description: 'Invalid scan request — more than one ranked selector (`fts`,
            `hybrid_text`, `ann`) supplied, a ranked selector with `mode: ids` or
            a snapshot/cache `source`, an empty `fts.query`, a non-finite `ann.radius`,
            `timeout_seconds: 0`, `mode: values` without `field`, or `field` on another
            mode.

'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
        '503':
          description: Cache unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    get:
      operationId: listScans
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: List ID and values scan jobs
      tags:
      - scans
      parameters:
      - "$ref": "#/components/parameters/namespace"
      responses:
        '200':
          description: Scan jobs listed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScanJobList"
  "/v2/namespaces/{namespace}/scans/{scan_id}":
    get:
      operationId: getScan
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Get scan status
      tags:
      - scans
      parameters:
      - "$ref": "#/components/parameters/namespace"
      - "$ref": "#/components/parameters/scan_id"
      responses:
        '200':
          description: Scan status
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScanJob"
        '404':
          description: Scan not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    delete:
      operationId: deleteScan
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Delete scan state
      tags:
      - scans
      parameters:
      - "$ref": "#/components/parameters/namespace"
      - "$ref": "#/components/parameters/scan_id"
      responses:
        '200':
          description: Scan state removed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/StatusResponse"
        '404':
          description: Scan not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v2/namespaces/{namespace}/scans/{scan_id}/results":
    get:
      operationId: getScanResults
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      summary: Get scan IDs or values
      tags:
      - scans
      parameters:
      - "$ref": "#/components/parameters/namespace"
      - "$ref": "#/components/parameters/scan_id"
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: 'Mode-dependent results — `{ids, total}` for ID scans, `{values,
            total, truncated}` for values scans.

'
          content:
            application/json:
              schema:
                oneOf:
                - "$ref": "#/components/schemas/ScanIdsResponse"
                - "$ref": "#/components/schemas/ScanValuesResponse"
        '404':
          description: Scan not found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/v2/namespaces/{namespace}":
    post:
      operationId: writeNamespace
      x-hevlayer-store-support:
        turbopuffer: supported
        search: supported
      x-turbopuffer-key: POST /v2/namespaces/{namespace}
      x-hevlayer-client-aliases:
      - operationId: branchNamespace
        upstreamKey: POST /v2/namespaces/{namespace}?stainless_overload=branchFrom
        query:
          stainless_overload: branchFrom
        requestBodySchema:
          "$ref": "#/components/schemas/TurbopufferBranchFromRequest"
        responseSchema:
          "$ref": "#/components/schemas/TurbopufferWriteResponse"
      - operationId: copyNamespace
        upstreamKey: POST /v2/namespaces/{namespace}?stainless_overload=copyFrom
        query:
          stainless_overload: copyFrom
        requestBodySchema:
          "$ref": "#/components/schemas/TurbopufferCopyFromRequest"
        responseSchema:
