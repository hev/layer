      x-turbopuffer-key: DELETE /v2/namespaces/{namespace}
      summary: Delete a namespace
      description: 'Hard-delete the upstream Turbopuffer namespace, then purge gateway-owned
        namespace state: Aerospike document rows and snapshot mirrors, S3 snapshots/search
        history/clickstream/shard metadata, in-memory job/cache/consistency state,
        and the operator-discovered Index CR when Index garbage collection is enabled.
        Turbopuffer 404 is treated as idempotent success and still triggers local
        cleanup. Other Turbopuffer failures return 502 before local cleanup runs.
