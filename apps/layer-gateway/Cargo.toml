[package]
name = "hevlayer-gateway"
version.workspace = true
edition = "2021"
autotests = false

[features]
default = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("pro"))'] }
[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
aws-config = { version = "1.10.1", features = ["behavior-version-latest"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
humantime = "2"
tower-http = { version = "0.7", features = ["trace", "cors"] }
thiserror = "2"
async-trait = "0.1"
# Turbopuffer's open-source tokenizer (the production `word_v4` code) —
# pinned exact while pre-1.0 so query-time tokens match index-time terms (RFC 0022).
alyze = "=0.1.5"
dashmap = "6"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
lattice = { git = "https://github.com/ErikKaum/lattice", rev = "fe4b29dbed7707f8be6f9e38fb6dbd71551dee2c" }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1"
prometheus = "0.14"
metrics-catalog = { path = "../../crates/metrics-catalog" }
vectorstore-core = { path = "../../crates/vectorstore-core" }
base64 = "0.23"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_yaml = "0.9"
ed25519-dalek = "3"
safetensors = "0.8"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[[test]]
name = "standalone_boot"
path = "tests/integration/standalone_boot.rs"
