[package]
name = "layer-original"
version.workspace = true
edition = "2021"
description = "The original-file reference carried on page rows: one format, one identity check, shared by extract, the Function backfill and the gateway."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
crc32fast = "1"
flate2 = "1"
base64 = "0.22"
