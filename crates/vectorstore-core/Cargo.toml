[package]
name = "vectorstore-core"
version.workspace = true
edition = "2021"

[features]
default = ["pgvector"]
pgvector = ["dep:sqlx"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("kube", "embedded-engine"))'] }
[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
http = "1"
async-trait = "0.1"
aws-credential-types = "1.3"
aws-sigv4 = "1.5"
base64 = "0.23"
futures = "0.3"
object_store = { version = "0.13", default-features = false, features = ["aws", "azure", "tls-webpki-roots"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "sync", "time"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"], optional = true }
sha2 = "0.10"
percent-encoding = "2"

[dev-dependencies]
hmac = "0.12"
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt"] }
