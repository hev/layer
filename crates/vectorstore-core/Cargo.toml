[package]
name = "vectorstore-core"
version.workspace = true
edition = "2021"

[features]
default = ["pgvector"]
pgvector = ["dep:sqlx", "dep:sha2"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("kube", "embedded-engine"))'] }
[dependencies]
async-trait = "0.1"
aws-config = { version = "1.10.1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"], optional = true }
sha2 = { version = "0.10", optional = true }
percent-encoding = "2"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt"] }
